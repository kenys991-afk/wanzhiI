<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>匯出單機版存檔 → 線上版</title>
<style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#1d1610;color:#f0e2c0;margin:0;padding:20px}
.box{background:#2b2016;border:2px solid #c9a227;border-radius:10px;padding:18px 22px;max-width:480px;margin:auto;line-height:1.7}
button{background:#c9a227;border:0;border-radius:6px;padding:6px 14px;font-weight:bold;cursor:pointer;margin:4px 4px 0 0}</style></head>
<body><div class="box"><h3>📤 單機版存檔</h3><div id="out">讀取中…</div><div id="btns"></div></div>
<script>
'use strict';
// 只讀取「這個網址（單機版）」瀏覽器裡的存檔，不修改任何資料。
// 只送出角色資料（不含帳號密碼雜湊），並且只送給開啟這個視窗的線上版頁面（?to=來源）。
const out=document.getElementById('out'), btns=document.getElementById('btns');
function J(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function slotsOf(k){ const d=J(k); return d&&Array.isArray(d.slots)?d.slots:[]; }
const accounts={};
const st=J('wzw_accounts_v1');
if(st&&st.accounts) for(const a of Object.keys(st.accounts)){ const ps=slotsOf('wzw_koa_slots_v1@'+a).filter(s=>s&&s.player).map(s=>s.player); if(ps.length) accounts[a]=ps; }
if(!st||!st.migrated){ // 還沒轉成帳號制的舊存檔 → 視為 player
  let ps=slotsOf('wzw_koa_slots_v1').filter(s=>s&&s.player).map(s=>s.player);
  if(!ps.length){ const l=J('wzw_koa_save_v1'); if(l&&l.player) ps=[l.player]; }
  if(ps.length){ const have=new Set((accounts.player||[]).map(p=>p.id||p.name)); accounts.player=(accounts.player||[]).concat(ps.filter(p=>!have.has(p.id||p.name))); }
}
const data={version:1,exported:Date.now(),accounts};
const names=Object.keys(accounts).map(a=>`<b>${a}</b>：${accounts[a].map(p=>`${p.name||p.id}（ID ${p.id||p.name}，Lv.${p.level|0}）`).join('、')}`);
out.innerHTML=names.length?names.join('<br>'):'這個瀏覽器的單機版沒有任何存檔。';
const to=new URLSearchParams(location.search).get('to');
if(names.length){
  const dl=document.createElement('button'); dl.textContent='💾 下載 JSON（備份／手動匯入）'; btns.appendChild(dl);
  dl.onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})); a.download='wzw_saves_export.json'; a.click(); };
  if(window.opener&&to){
    try{ window.opener.postMessage({wzwExport:data},to); out.innerHTML+='<br><br>✅ 已傳給線上版視窗，這個視窗即將關閉…'; setTimeout(()=>window.close(),1500); }
    catch(e){ out.innerHTML+='<br>⚠️ 無法傳回線上版：'+e.message; }
  }
}
</script></body></html>
