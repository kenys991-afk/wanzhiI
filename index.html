  ctx.fillStyle='rgba(0,0,0,0.32)';
  ctx.beginPath();ctx.ellipse(sx, sy+18, 16, 7, 0, 0, Math.PI*2);ctx.fill();
  const now=performance.now();
  if(p.invuln>0 && Math.floor(p.invuln/50)%2) ctx.globalAlpha=0.4;
  if(p.stealth>0) ctx.globalAlpha=0.32+0.08*Math.sin(now/150);
  { const o=playerSpriteOpt(p); o.anim=animTrack(p,p.x,p.y,now); drawHumanoid(sx,sy,o); }
  ctx.globalAlpha=1;
  { const buffs=[];
    if(p.buffWarCry>0) buffs.push(['255,90,40', p.buffWarCry]);
    if(p.buffGuard>0) buffs.push(['255,210,90', p.buffGuard]);
    if(p.shield&&p.shield.amt>0) buffs.push(['255,220,120', p.shield.t||4000]);
    if(p.buffFocus>0) buffs.push(['120,170,255', p.buffFocus]);
    if(p.totemAtk>0) buffs.push(['255,140,60', p.totemAtk]);
    if(p.totemDef>0) buffs.push(['170,120,255', p.totemDef]);
    if(buffs.length){ const [rgb,left]=buffs[0]; const a=Math.max(0.08, Math.min(0.42, (left||1000)/9000));
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.max(a,.28);
      const g=ctx.createLinearGradient(sx,sy-92,sx,sy+8);
      g.addColorStop(0,`rgba(${rgb},0)`); g.addColorStop(.7,`rgba(${rgb},.9)`); g.addColorStop(1,`rgba(${rgb},0)`);
      ctx.fillStyle=g; ctx.fillRect(sx-12,sy-92,24,100); ctx.restore(); }
  }
  if(p.shield&&p.shield.amt>0){ ctx.save(); const a=Math.min(1,p.shield.amt/Math.max(1,p.shield.max||p.shield.amt)); ctx.globalAlpha=0.18+0.2*a; ctx.fillStyle='#fff4c0'; ctx.beginPath(); ctx.ellipse(sx,sy-2*CHAR_SCALE,15*CHAR_SCALE,25*CHAR_SCALE,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=0.55+0.3*Math.sin(now/200); ctx.strokeStyle='#ffd860'; ctx.lineWidth=3; ctx.stroke(); ctx.restore(); }
  ctx.font='11px "Microsoft JhengHei",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#c9a227';
  ctx.fillText(p.name,sx,sy-18*CHAR_SCALE);
  if(curGM){ const nw=ctx.measureText(p.name).width; ctx.save(); ctx.font='bold 10px "Microsoft JhengHei",sans-serif'; ctx.textAlign='left';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(40,10,10,.85)'; ctx.strokeText('👑GM',sx+nw/2+4,sy-18*CHAR_SCALE); ctx.fillStyle='#ff5a3c'; ctx.fillText('👑GM',sx+nw/2+4,sy-18*CHAR_SCALE); ctx.restore(); }
  const ji=jobInfo(p);
  ctx.font='9px "Microsoft JhengHei",sans-serif';
  ctx.fillStyle='rgba(26,18,8,0.65)';
  const tw=ctx.measureText(ji.name).width;
  ctx.fillRect(sx-tw/2-3,sy+16*CHAR_SCALE,tw+6,11);
  ctx.fillStyle='#f5e6c8';
  ctx.fillText(ji.name,sx,sy+21*CHAR_SCALE);
}

    if(inHub||!hub){ R.mode='rest'; msg('🤖 回到城鎮，休息回復中…'); updateBotUI(); return null; }
    if(RECALL) return null; // 回程術吟唱中：站著不動
    if(B_recallOk(p)&&performance.now()>(R.recallNo||0)){ R.recallNo=performance.now()+12000; if(useRecall()){ msg('🤖 撤退：使用 🏠 回程術'); return null; } }
    if((p.skills.sprint|0)>0&&!(p.skillCd.sprint>0)&&!(p.sprintTimer>0)) useSprint();
    return botSteer(p,{x:(hub.tx+0.5)*TILE,y:(hub.ty+2.5)*TILE},dt);
  }
  // 城內休息：每秒回復 3% HP、4% MP（僅自動練功的休息狀態）
  p.hp=Math.min(maxHp,p.hp+maxHp*0.03*dt/1000); p.mp=Math.min(maxMp,p.mp+maxMp*0.04*dt/1000);
  if(p.hp>=maxHp*0.95&&p.mp>=maxMp*0.8){ R.mode='fight'; R.target=null; msg('🤖 休息完畢，回去練功！'); updateBotUI(); }
  return null;
}
/** 每幀：回傳移動方向 {x,y}（或 null＝原地） */
function botUpdate(dt){
  const p=game.player, B=ensureBot(p), R=botRt, c=classOf(p);
  if(p.hp<=0) return null;
  if(!R.home) R.home={x:p.x,y:p.y};
  if(Math.hypot(p.x-R.px,p.y-R.py)>300){ R.target=null; if(R.mode==='retreat') R.mode='rest'; } // 死亡回城／瞬移
  R.px=p.x; R.py=p.y;
  if(botJobWait(p)&&B.ackTier!==jobTierOf(p)){ // 到達轉職等級：暫停並等待玩家轉職
    B.on=false; B.wait=true; R.target=null;
    msg(`🤖 已達轉職等級，等待你來轉職！${botPathHint(p)}`); floatText(p.x,p.y-90,'🤖 等你轉職','#ffe060',18);
    updateBotUI(); saveGame(true); return null;
  }
  R.potionCd=Math.max(0,R.potionCd-dt);
  const CF=botCfg(p); if(CF.loot) tryPickupGroundLoot(false);
  const maxHp=effectiveMaxHp(p), maxMp=effectiveMaxMp(p), hpR=p.hp/maxHp, mpR=p.mp/maxMp;
  if(R.mode==='retreat'||R.mode==='rest') return botRetreat(p,dt);
  let near=0; monstersIn(p.x,p.y,70,()=>near++);
  if(botSelfCare(p,hpR,near)) return null;
  if(CF.ret>0&&hpR<CF.ret/100&&!apHasHp(p)){ R.mode='retreat'; R.target=null; msg('🤖 生命過低且沒有藥水，撤退回城休息！'); updateBotUI(); return botRetreat(p,dt); }
  R.think-=dt;
  if(R.think<=0||!R.target||!R.target.alive||botOutOfLeash(R.target)||(AI_MODE&&aiTaken(p,R.target))){ const nt=botPickTarget(p); if(nt!==R.target) R.chaseT=0; R.target=nt; R.think=600; }
  const t=R.target;
  if(!t){
    if(CF.route&&!NAV.legacy){ const pd=botPatrol(p,dt); if(pd!==undefined) return pd; }
    R.idleT=(R.idleT||0)+dt;
    if(R.idleT>4000){ // 附近清空了（魔物不會原地重生）：把練功據點移到相鄰、等級合適的新區域
      R.idleT=0; if(!R.origin) R.origin={x:R.home.x,y:R.home.y};
      const capLv=Math.max(contOf().lvMin+2,(p.level|0)+3);
      for(let k=0;k<16;k++){
        const a=Math.random()*Math.PI*2, nx=R.home.x+Math.cos(a)*12*TILE, ny=R.home.y+Math.sin(a)*12*TILE, tx=nx/TILE, ty=ny/TILE;
        if(Math.hypot(nx-R.origin.x,ny-R.origin.y)>3*botLeash(p)) continue;           // 不離開起點太遠
        if(Math.hypot(tx-8,ty-8)<7||inMonsterFreeHub(nx,ny,3)) continue;              // 不進城
        if(inNewbieZone(nx,ny)!==inNewbieZone(R.origin.x,R.origin.y)) continue;     // 新手區內外不互換據點
        if(monsterBaseLevelAt(tx,ty)>capLv) continue;        // 不往高等區
        R.home={x:nx,y:ny}; R.wanderPt={x:nx,y:ny}; break;
      }
    }
    if(!R.wanderPt||dist(p,R.wanderPt)<24){ const a=Math.random()*Math.PI*2, r=Math.random()*botLeash(p)*0.6; R.wanderPt={x:R.home.x+Math.cos(a)*r,y:R.home.y+Math.sin(a)*r}; }
    return botSteer(p,R.wanderPt,dt);
  }
  R.idleT=0;
  const d=dist(p,t), reach=(c.range+monR(t))*0.85;
  botCast(p,t,d,near);
  if(d<=reach){
    R.chaseT=0; p.lastAim=Math.atan2(t.y-p.y,t.x-p.x); p.facing=Math.cos(p.lastAim)>=0?1:-1;
    if(p.atkCd<=0&&(!c.manaCost||p.mp>=c.manaCost)) tryAttack();
    return null;
  }
  R.chaseT+=dt; if(R.chaseT>12000){ R.bad.add(t); R.target=null; R.chaseT=0; } // 追不到 → 換目標
  return botSteer(p,t,dt);
}

function hbSlotInfo(p,e){ if(!e) return null;

// ===== 巨集（最多 8 個，每個最多 6 步；存在角色資料，線上版存伺服器）=====

function macroStep(p,st){
  if(st.t==='i'){ const def=ITEMS[st.id], slot=(p.inv||[]).find(x=>x.id===st.id); if(!def||!slot||!def.use) return false;
    if(!tradeBlocks(def)&&def.use(p)){ slot.qty--; if(slot.qty<=0) p.inv.splice(p.inv.indexOf(slot),1); updateHUD(); if(ONLINE&&net) net.saveSoon=true; return true; } return false; }
  const d=skillDef(st.id); if(!d||(p.skills[st.id]|0)<=0||!skillAvailable(p,d)||!skillIsActive(d)) return false;

/** 自動打怪：目標在射程內時，依快捷欄順序施放第一個「有步驟可用」的巨集（每個巨集結束後隔 3 秒才再用） */

  },{passive:true});

  },{passive:true});

function updateProjectiles(p,dt){
  const f=Math.max(0.25,Math.min(3,dt/16.667));
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i]; let done=false, blocked=false;
    if(pr.tgt&&!pr.tgt.alive) pr.tgt=null;
    const n=Math.max(1,Math.ceil(pr.sp*f/6));
    for(let k=0;k<n&&!done;k++){
      if(pr.tgt){ const a=Math.atan2(pr.tgt.y-pr.y,pr.tgt.x-pr.x); pr.vx=Math.cos(a)*pr.sp; pr.vy=Math.sin(a)*pr.sp; }
      else if(pr.homing){ let tg=null,td=200; forEachNearbyEntity(pr.x,pr.y,(e)=>{ if(e.kind!=='monster'||!e.alive||(pr.hitSet&&pr.hitSet.has(e)))return; const d=dist(pr,e); if(d<td){td=d;tg=e} });
        if(tg){ const a0=Math.atan2(pr.vy,pr.vx), a1=Math.atan2(tg.y-pr.y,tg.x-pr.x); let da=a1-a0; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI; const a=a0+clamp(da,-0.18*f/n,0.18*f/n); pr.vx=Math.cos(a)*pr.sp; pr.vy=Math.sin(a)*pr.sp; } }
      if(pr.boomerang&&pr.life<pr.maxLife/2){ if(!pr.back){ pr.back=true; pr.hitSet=new Set(); } const a=Math.atan2(p.y-pr.y,p.x-pr.x); pr.vx=Math.cos(a)*pr.sp; pr.vy=Math.sin(a)*pr.sp; if(dist(pr,p)<16){ pr.life=0; break; } }
      pr.x+=pr.vx*f/n; pr.y+=pr.vy*f/n;
      forEachNearbyEntity(pr.x,pr.y,(e)=>{
        if(done||e.kind!=='monster'||!e.alive) return; if(pr.hitSet&&pr.hitSet.has(e)) return;
        if(dist(pr,e)<monR(e)+pr.r+(e===pr.tgt?4:0)){
          if(pr.hitSet) pr.hitSet.add(e);
          dmgMonster(e,pr.dmg,Object.assign({},pr.o||{},{fx:pr.x-pr.vx*3,fy:pr.y-pr.vy*3})); pr.hitAny=1;
          if(pr.basic){ onBasicHit(p); pr.basic=0; }
          if(e===pr.tgt) pr.tgt=null;
          if((pr.pierce|0)>0) pr.pierce--; else done=true;
        } });
      if(!done&&!pr.boomerang&&!pr.tgt&&solidTile(tileAt(pr.x,pr.y))){ blocked=true; break; } // 有鎖定目標＝飛越樹木／岩石
    }
    pr.life-=f;
    if(done||blocked||pr.life<=0){ if(pr.track){ if(pr.hitAny) RSTAT.hits++; else if(blocked) RSTAT.blocked++; else RSTAT.lost++; } projectiles.splice(i,1); }
  }
}

const LOOP_ERR={n:0,seen:new Set(),noteT:0};
function loopErr(where,err){ LOOP_ERR.n++; const k=where+':'+(err&&err.message);
  if(!LOOP_ERR.seen.has(k)&&LOOP_ERR.seen.size<30){ LOOP_ERR.seen.add(k); console.error('[loop '+where+']',err); try{ if(ONLINE&&net.ws&&net.ws.readyState===1) netSend('clerr',{w:where,m:String(err&&err.message).slice(0,160),s:String(err&&err.stack||'').split('\n').slice(1,3).join(' | ').slice(0,240)}); }catch(_){} }
  const now=performance.now(); if(now-LOOP_ERR.noteT>15000){ LOOP_ERR.noteT=now; try{ msg('⚠️ 畫面發生小錯誤，已自動略過（遊戲持續執行）'); }catch(_){} } }
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(50,Math.max(0,t-(lastT||t)));
  lastT=t;
  try{ update(dt); }catch(e){ loopErr('update',e); }
  if(ONLINE){ try{ netTick(dt); }catch(e){ loopErr('net',e); } }
  try{ if(!AI_MODE||t-aiDrawT>1000){ aiDrawT=t; draw(); } else if(ONLINE) netInterp(); }catch(e){ loopErr('draw',e); try{ for(let i=0;i<24;i++) ctx.restore(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }catch(_){} } // AI 玩家頁面（無人觀看）：每秒只畫一次，省 CPU
}
let aiDrawT=0;

// ========== 職業樹檢視（唯讀；從左上人物欄開啟，不暫停遊戲；轉職仍需找冒險主） ==========
const jobTree={open:false,expanded:{},detail:null,raf:0,sel:null};
const JT_PREVIEW_SCALE=0.5; // drawHumanoid 內部再乘 CHAR_SCALE，0.5 剛好塞進 130×150 預覽

function jtEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jobTreeIsOpen(){ return jobTree.open; }
/** 節點狀態：current 目前職業／path 已走過／next 下一步可選／reach 未來可達／dim 已無法選擇 */
function jobNodeState(p,id){
  const cur=jobOf(p);
  if(id===cur) return 'current';
  if(jobLineage(cur).indexOf(id)>=0) return 'path';
  if(JOBS[id].parent===cur) return 'next';
  if(jobLineage(id).indexOf(cur)>=0) return 'reach';
  return 'dim';
}
function jobNextReady(p,id){ return !!p.tutorialDone && (p.level|0)>=JOB_TIER_LV[JOBS[id].tier]; }
/** 該職業本身帶來的技能（招牌 sig ＋ 專屬新技能），讀 JOBS / SKILL_DEFS / JOB_SKILL_TABLE */
function jobOwnSkills(id){
  const j=JOBS[id], out=[], seen={};
  const add=(sid)=>{ if(seen[sid]) return; const def=skillDef(sid); if(!def) return; seen[sid]=1; out.push({id:sid,def,js:def.jobSkill||null,own:def.job===id}); };
  for(const sid of (j.sig||[])) add(sid);
  for(const js of JOB_SKILL_TABLE) if(js.job===id) add(js.id);
  out.sort((a,b)=>(a.own?1:0)-(b.own?1:0));
  return out;
}
function jobStatusText(p,id){
  const st=jobNodeState(p,id), lv=JOB_TIER_LV[JOBS[id].tier];
  if(st==='current') return '★ 目前職業';
  if(st==='path') return '✔ 已轉職';
  if(st==='next') return jobNextReady(p,id)?'✅ 可轉職！請到天使雕像':(!p.tutorialDone?`需先完成冒險主教學，Lv.${lv} 可轉`:`Lv.${lv} 可轉（目前 Lv.${p.level|0}）`);
  if(st==='reach') return `後續可達（${JOB_TIER_LABEL[JOBS[id].tier]} Lv.${lv}）`;
  return '✖ 此分支已無法選擇';
}
function jobShortDesc(p,id){
  const j=JOBS[id], lv=JOB_TIER_LV[j.tier];
  const sk=jobOwnSkills(id).map(o=>`${o.def.icon||''}${o.def.name}${o.own?`（${o.js&&o.js.tier>=3?'V':'Q'}）`:''}`).join('、');
  const bonus=jobBonusText(j.bonus);
  return `<b>${jtEsc(j.icon)} ${jtEsc(j.name)}</b>　${JOB_TIER_LABEL[j.tier]}${j.tier?` · Lv.${lv}`:''}　<span class="st">${jtEsc(jobStatusText(p,id))}</span><br>`
    +`${jtEsc(j.desc||'')}${bonus?`<br>加成：${jtEsc(bonus)}`:''}${sk?`　技能：${jtEsc(sk)}`:''}　<span style="color:#a89060">（點擊看詳情）</span>`;
}
function jtNodeHTML(p,id){
  const j=JOBS[id], st=jobNodeState(p,id);
  let cls='jt-node '+(st==='current'?'path current':st);
  let tag='';
  if(st==='current') tag='目前';
  else if(st==='path') tag='已轉';
  else if(st==='next'){ const r=jobNextReady(p,id); if(r) cls+=' ready'; tag=r?'可轉職':`Lv.${JOB_TIER_LV[j.tier]}`; }
  if(jobTree.sel===id) cls+=' sel';
  return `<button type="button" class="${cls}" data-job="${id}" aria-label="${jtEsc(j.name)}"><span class="ic">${jtEsc(j.icon)}</span><span class="nm">${jtEsc(j.name)}</span>${tag?`<span class="tag">${tag}</span>`:''}</button>`;
}
function jobTreeDefaultExpand(p){
  jobTree.expanded={};
  const cur=jobOf(p), curTier=jobTierOf(p);
  for(const id of Object.keys(JOBS)){
    if(JOBS[id].tier!==2) continue;
    const st=jobNodeState(p,id);
    // 新手：全部收合（畫面太長）；一轉：展開 3 個可選二轉；二轉以上：展開自己那條
    jobTree.expanded[id]= curTier>=1 && (st==='current'||st==='path'||st==='next');
  }
  void cur;
}
function renderJobTree(){
  if(!game||!game.player) return;
  const p=game.player, cur=jobOf(p), curTier=jobTierOf(p);
  // 階段梯
  const lad=[];
  for(let t=0;t<JOB_TIER_LV.length;t++){
    const c=t<=curTier?'done':(t===curTier+1?'nx':'');
    lad.push(`<span class="step ${c}">${JOB_TIER_LABEL[t]}${t?` Lv.${JOB_TIER_LV[t]}`:''}</span>`);
    if(t<JOB_TIER_LV.length-1) lad.push('<span class="arr">→</span>');
  }
  lad.push(`<span class="jt-legend"><span><i style="background:#c9a227"></i>已走路線</span><span><i style="border:2px dashed #7fe07f"></i>下一步</span><span><i style="background:#555;opacity:.6"></i>已無法選擇</span></span>`);
  document.getElementById('jt-ladder').innerHTML=lad.join('');
  // 樹
  const root=Object.keys(JOBS).find(k=>JOBS[k].tier===0&&!JOBS[k].parent)||'novice';
  let h=`<div class="jt-root">${jtNodeHTML(p,root)}<div class="jt-down">▼ ${JOB_TIER_LABEL[1]} Lv.${JOB_TIER_LV[1]}（3 選 1）</div></div><div class="jt-branches">`;
  for(const b1 of jobChildren(root)){
    const onPath1=jobLineage(cur).indexOf(b1)>=0;
    h+=`<div class="jt-branch${onPath1?' onpath':''}"><div class="jt-tier"><span>${JOB_TIER_LABEL[1]}</span><b>Lv.${JOB_TIER_LV[1]}</b></div>${jtNodeHTML(p,b1)}`;
    h+=`<div class="jt-tier"><span>${JOB_TIER_LABEL[2]}（3 選 1）</span><b>Lv.${JOB_TIER_LV[2]}</b></div>`;
    for(const b2 of jobChildren(b1)){
      const kids=jobChildren(b2), open=!!jobTree.expanded[b2];
      const onPath2=jobLineage(cur).indexOf(b2)>=0;
      h+=`<div class="jt-two"><div class="jt-two-row">${jtNodeHTML(p,b2)}`;
      if(kids.length) h+=`<button type="button" class="jt-tog" data-toggle="${b2}" aria-expanded="${open}" title="${open?'收合':'展開'}${JOB_TIER_LABEL[3]}">${open?'▾':'▸'} ${JOB_TIER_LABEL[3]}</button>`;
      h+='</div>';
      if(kids.length && open){
        h+=`<div class="jt-sub${onPath2?' onpath':''}"><div class="jt-sublab">${JOB_TIER_LABEL[3]} Lv.${JOB_TIER_LV[3]}（3 選 1）</div>${kids.map(k=>jtNodeHTML(p,k)).join('')}</div>`;
      }
      h+='</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('jt-body').innerHTML=h;
  if(!jobTree.sel) jtShowInfo(cur);
}
function jtShowInfo(id){
  if(!game||!JOBS[id]) return;
  document.getElementById('jt-info').innerHTML=jobShortDesc(game.player,id);
}
function jtSkillRowHTML(o){
  const d=o.def, js=o.js;
  let key, mp, cd, eff, kind;
  let costTxt=null, lineTxt='';
  if(js){
    key=js.tier>=3?'V':'Q'; cd=jsCd(js,1); kind=js.tag||'';
    eff=jobSkillEffText(js,1); costTxt=jsCostText(js); lineTxt=JS_LINE_LABEL[js.line]||'';
  } else {
    const ds=d.desc||'', m=/按\s*([A-Za-z])/.exec(ds);
    key=/^被動/.test(ds)?'被動':(m?m[1].toUpperCase():'—');
    kind=ds.split('：')[0]||'';
    mp=0;
    const e1=d.effectDesc?d.effectDesc(1):'';
    const c=/冷卻\s*([\d.]+)\s*秒/.exec(e1); cd=c?+c[1]:null;
    eff=e1.replace(/\s*·\s*冷卻\s*[\d.]+\s*秒/,'');
    const tail=ds.replace(/^[^：]*：/,''); if(tail) eff=`${tail}｜${eff}`;
  }
  return `<div class="jt-skill"><div class="sk-top"><span>${jtEsc(d.icon||'')}</span><span class="sk-nm">${jtEsc(d.name)}</span>`
    +`<span class="jt-chip key">${key==='被動'?'被動':'鍵 '+key}</span>`
    +`<span class="jt-chip ${o.own?'new':(o.general?'':'sig')}">${o.own?'專屬新技能':(o.general?'通用':'招牌')}</span>`
    +(lineTxt?`<span class="jt-chip line-${js.line}">${jtEsc(lineTxt)}</span>`:'')
    +(kind?`<span class="jt-chip">${jtEsc(kind)}</span>`:'')
    +`<span class="jt-chip">${costTxt!=null?jtEsc(costTxt):`MP ${mp||0}`}</span>`
    +(cd!=null?`<span class="jt-chip">冷卻 ${cd} 秒</span>`:'')
    +`</div><div class="sk-eff">${jtEsc(eff)}</div></div>`;
}
/** 職業詳情：技能共鳴（本職優先，再列繼承自前一階的） */
function jtResonanceHTML(p,id){
  const line=jobLineage(id);
  const list=RESONANCES.filter(r=>line.indexOf(r.job)>=0).sort((a,b)=>(a.job===id?0:1)-(b.job===id?0:1)||JOBS[b.job].tier-JOBS[a.job].tier);
  if(!list.length) return '';
  const rows=list.map(r=>{
    const on=rzActive(p,r), onLine=rzOnLine(p,r), miss=rzMissing(p,r), sc=on?rzScale(p,r):1;
    const pair=rzSkills(r).map(sid=>{ const d=skillDef(sid), lv=p.skills[sid]|0; return `<span class="${lv>0?'lv':'nolv'}">${jtEsc(d.icon||'')}${jtEsc(d.name)} <small>${lv>0?'Lv.'+lv:'未學'}</small></span>`; }).join(' <b>＋</b> ');
    const why=on?'':(!onLine?`需走「${JOBS[r.job].name}」路線`:`尚未學會：${miss.map(sid=>skillDef(sid).name).join('、')}`);
    return `<div class="jt-rz${on?' on':''}"><div class="sk-top"><span class="rz-nm">🔗 ${jtEsc(r.name)}</span>`
      +`<span class="jt-chip">${r.job===id?'本職':'繼承'} · ${JOB_TIER_LABEL[JOBS[r.job].tier]} ${jtEsc(JOBS[r.job].name)}</span>`
      +(r.pre.length>1?'<span class="jt-chip">三重共鳴</span>':'')
      +`<span class="jt-chip ${on?'rz-on':'rz-off'}">${on?'✔ 啟用中':'✖ 未啟用'}</span></div>`
      +`<div class="rz-pair">${pair}</div>`
      +`<div class="sk-eff"><b>被動</b>：${jtEsc(rzPassiveText(r,sc))}${on&&sc>1?`（技能等級加成 ×${sc.toFixed(2)}）`:'（每多 1 技能等級 +5%）'}</div>`
      +`<div class="sk-eff"><b>連段</b>：${jtEsc(rzComboText(r))}</div>`
      +(why?`<div class="rz-why">${jtEsc(why)}</div>`:'')+`</div>`;
  }).join('');
  return `<div class="jt-dsec"><h4 class="own"><span>🔗 技能共鳴</span><small>轉職前後技能皆 Lv≥1 → 被動生效；先放前技、${RZ_WINDOW/1000} 秒內接後技 → 共鳴連段</small></h4>${rows}</div>`;
}
function openJobDetail(id){
  if(!game||!JOBS[id]) return;
  const p=game.player, j=JOBS[id], line=jobLineage(id);
  jobTree.detail=id; jobTree.sel=id;
  const lv=JOB_TIER_LV[j.tier];
  const st=jobNodeState(p,id);
  const prof=CLASSES[jobProf(id)]||CLASSES.novice;
  // 累積加成（沿職業鏈）與每級成長（取最近一階的 grow）
  const tot={}; for(const k of line){ const b=JOBS[k].bonus||{}; for(const s in b) tot[s]=(tot[s]||0)+b[s]; }
  let grow=null; for(const k of line.slice().reverse()){ if(JOBS[k].grow){ grow=JOBS[k].grow; break; } }
  const growTxt=grow?[grow.hp?`HP+${grow.hp}`:'',grow.mp?`MP+${grow.mp}`:'',grow.atk?`攻+${grow.atk}`:''].filter(Boolean).join(' '):'';
  const stColor=st==='dim'?'#c08080':(st==='next'?'#b8f0b8':'#ffe08a');
  let h=`<div class="jt-dtop"><canvas id="jt-preview" width="130" height="150" aria-label="${jtEsc(j.name)} 外觀預覽"></canvas><div class="jt-dmeta">`
    +`<h3 style="color:#ffe08a;text-shadow:0 0 8px rgba(201,162,39,.45)"><span class="jt-swatch" style="background:${jtEsc(j.color||'#c9a227')}" title="職業代表色"></span>${jtEsc(j.icon)} ${jtEsc(j.name)}</h3>`
    +`<div class="row"><b>${JOB_TIER_LABEL[j.tier]}</b> · 需求 <b>${j.tier?`Lv.${lv}`:'起始職業'}</b>　戰鬥型態：<b>${jtEsc(prof.icon)} ${jtEsc(prof.name)}</b>（${prof.proj?'遠程':'近戰'}）</div>`
    +`<div class="row">路線：${line.map(k=>`<b>${jtEsc(JOBS[k].name)}</b>`).join(' → ')}</div>`
    +`<div class="row">轉職加成：<b>${jtEsc(jobBonusText(j.bonus)||'—')}</b></div>`
    +(line.length>2?`<div class="row">累積加成：<b>${jtEsc(jobBonusText(tot)||'—')}</b></div>`:'')
    +(growTxt?`<div class="row">每級成長：<b>${jtEsc(growTxt)}</b></div>`:'')
    +(j.tier?`<div class="row">屬性需求：${jobAttrNeedHTML(p,id)}</div>`:'')
    +`<div class="desc">${jtEsc(j.desc||'')}</div>`
    +line.filter(k=>JOBS[k].trait).map(k=>`<div class="row jt-trait">✦ <b>${jtEsc(JOBS[k].name)}特性</b>：${jtEsc(JOBS[k].trait)}</div>`).join('')
    +`<span class="stat" style="color:${stColor}">${jtEsc(jobStatusText(p,id))}</span>`
    +`</div></div>`;
  // 技能：本職＋繼承（依階段標示），重複的只列在最早取得的那階
  const shown={};
  const secs=[];
  for(const k of line){
    if(JOBS[k].tier===0) continue;
    const list=jobOwnSkills(k);
    const fresh=list.filter(o=>!shown[o.id]);
    const dup=list.filter(o=>shown[o.id]);
    const own=k===id;
    let s=`<div class="jt-dsec"><h4 class="${own?'own':''}"><span>${JOB_TIER_LABEL[JOBS[k].tier]} · ${jtEsc(JOBS[k].icon)} ${jtEsc(JOBS[k].name)}</span><small>${own?'本職技能':'繼承自前一階'} · Lv.${JOB_TIER_LV[JOBS[k].tier]}</small></h4>`;
    s+=fresh.map(jtSkillRowHTML).join('')||'<div class="jt-dup">（此階無新技能）</div>';
    if(dup.length) s+=`<div class="jt-dup">↑ 招牌延續：${dup.map(o=>`${jtEsc(o.def.icon||'')}${jtEsc(o.def.name)}（${JOB_TIER_LABEL[shown[o.id]]}已列）`).join('、')}</div>`;
    s+='</div>';
    for(const o of fresh) shown[o.id]=JOBS[k].tier;
    secs.push(s);
  }
  // 由本職往回排：先看自己，再看繼承
  h+=secs.reverse().join('');
  h+=jtResonanceHTML(p,id);
  const general=SKILL_DEFS.filter(d=>!d.job&&!d.free);
  if(j.tier===0){
    h+=`<div class="jt-dsec"><h4><span>通用技能</span><small>任何職業皆可在稻草人學習</small></h4>${general.map(d=>jtSkillRowHTML({id:d.id,def:d,js:null,own:false,general:true})).join('')}</div>`;
  }
  h+=`<div class="jt-note">※ 技能數值為 Lv.1；Q＝二轉技、V＝三轉技。通用技能（${general.map(d=>jtEsc(d.name)).join('、')}）任何職業皆可在稻草人學習。<br>※ 本畫面僅供查看，轉職請找冒險主。</div>`;
  document.getElementById('jt-dtitle').textContent=`${j.icon} ${j.name}`;
  const body=document.getElementById('jt-dbody'); body.innerHTML=h; body.scrollTop=0;
  document.getElementById('jt-detail').classList.add('open');
  jtShowInfo(id);
  jtStartPreview(id);
  const back=document.getElementById('jt-back'); if(back) back.focus({preventScroll:true});
}
function jtStartPreview(id){
  jtStopPreview();
  const cv=document.getElementById('jt-preview'); if(!cv) return;
  const who={job:id,cls:jobProf(id),jobTier:JOBS[id].tier,facing:1};
  const t0=performance.now();
  const frame=(t)=>{
    if(!jobTree.open||jobTree.detail!==id||!document.body.contains(cv)){ jobTree.raf=0; return; }
    paintHumanoidPreview(cv,who.cls,who.jobTier,JT_PREVIEW_SCALE,(t-t0)/400,who);
    jobTree.raf=requestAnimationFrame(frame);
  };
  paintHumanoidPreview(cv,who.cls,who.jobTier,JT_PREVIEW_SCALE,0,who);
  jobTree.raf=requestAnimationFrame(frame);
}
function jtStopPreview(){ if(jobTree.raf){ cancelAnimationFrame(jobTree.raf); jobTree.raf=0; } }
function closeJobDetail(){
  const id=jobTree.detail;
  jobTree.detail=null; jtStopPreview();
  document.getElementById('jt-detail').classList.remove('open');
  if(jobTree.open){
    renderJobTree();
    const n=id&&document.querySelector(`#jt-body .jt-node[data-job="${id}"]`);
    if(n){ n.focus({preventScroll:true}); n.scrollIntoView({block:'nearest'}); }
  }
}
function openJobTree(){
  if(!game||!game.player) return;
  // 不暫停遊戲；只放開移動輸入，避免開著視窗時角色一直走
  for(const k in keys){ if(k!=='mx'&&k!=='my') keys[k]=false; }
  touchDir.u=touchDir.d=touchDir.l=touchDir.r=0;
  document.querySelectorAll('.dpad-btn.active').forEach(b=>b.classList.remove('active'));
  jobTree.open=true; jobTree.detail=null; jobTree.sel=null;
  jobTreeDefaultExpand(game.player);
  renderJobTree();
  document.getElementById('jt-detail').classList.remove('open');
  const ov=document.getElementById('jobtree-overlay');
  ov.classList.add('open'); ov.setAttribute('aria-hidden','false');
  // 捲到目前職業
  const curNode=document.querySelector('#jt-body .jt-node.current');
  document.getElementById('jt-body').scrollTop=0;
  if(curNode) curNode.scrollIntoView({block:'nearest'});
  const x=document.getElementById('jt-close'); if(x) x.focus({preventScroll:true});
}
function closeJobTree(){
  jobTree.open=false; jobTree.detail=null; jobTree.sel=null; jtStopPreview();
  document.getElementById('jt-detail').classList.remove('open');
  const ov=document.getElementById('jobtree-overlay');
  ov.classList.remove('open'); ov.setAttribute('aria-hidden','true');
  for(const k in keys){ if(k!=='mx'&&k!=='my') keys[k]=false; }
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
(function initJobTreeUI(){
  const ov=document.getElementById('jobtree-overlay'), body=document.getElementById('jt-body');
  document.getElementById('btn-jobtree').addEventListener('click',(e)=>{ e.stopPropagation(); openJobTree(); });
  const jl=document.getElementById('hud-job');
  jl.addEventListener('click',(e)=>{ e.stopPropagation(); openJobTree(); });
  jl.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); openJobTree(); } });
  document.getElementById('jt-close').addEventListener('click',closeJobTree);
  document.getElementById('jt-dclose').addEventListener('click',closeJobTree);
  document.getElementById('jt-back').addEventListener('click',closeJobDetail);
  ov.addEventListener('click',(e)=>{ if(e.target===ov) closeJobTree(); });
  document.getElementById('jt-expand-all').addEventListener('click',()=>{ for(const k of Object.keys(JOBS)) if(JOBS[k].tier===2) jobTree.expanded[k]=true; renderJobTree(); });
  document.getElementById('jt-collapse-all').addEventListener('click',()=>{ jobTree.expanded={}; renderJobTree(); });
  body.addEventListener('click',(e)=>{
    const tg=e.target.closest('.jt-tog');
    if(tg){ const id=tg.dataset.toggle; jobTree.expanded[id]=!jobTree.expanded[id]; renderJobTree();
      const again=body.querySelector(`.jt-tog[data-toggle="${id}"]`); if(again) again.focus({preventScroll:true}); return; }
    const n=e.target.closest('.jt-node'); if(n&&JOBS[n.dataset.job]) openJobDetail(n.dataset.job);
  });
  const hov=(e)=>{ const n=e.target.closest&&e.target.closest('.jt-node'); if(n&&JOBS[n.dataset.job]) jtShowInfo(n.dataset.job); };
  body.addEventListener('mouseover',hov);
  body.addEventListener('focusin',hov);
})();

// 虛擬搖桿：螢幕方向 → 世界方向（等角投影：iso x∝(wx−wy)、iso y∝(wx+wy)/2）
(function(){
  const el=document.getElementById('m-joy'), knob=document.getElementById('m-joy-knob'); if(!el) return;
  let tid=null;
  function upd(t){ const r=el.getBoundingClientRect(), R=r.width/2; let dx=t.clientX-(r.left+R), dy=t.clientY-(r.top+R);
    const d=Math.hypot(dx,dy), lim=R*0.62; if(d>lim){ dx*=lim/d; dy*=lim/d; }
    knob.style.transform=`translate(${dx}px,${dy}px)`;
    if(d<R*0.16){ joy.on=false; joy.x=joy.y=0; return; }
    const sx=dx/d, sy=dy/d; let wx=sx+2*sy, wy=2*sy-sx; const n=Math.hypot(wx,wy)||1; joy.on=true; joy.x=wx/n; joy.y=wy/n; }
  function end(){ tid=null; joy.on=false; joy.x=joy.y=0; knob.style.transform=''; }
  el.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; tid=t.identifier; upd(t); },{passive:false});
  el.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===tid) upd(t); },{passive:false});
  el.addEventListener('touchend',e=>{ for(const t of e.changedTouches) if(t.identifier===tid) end(); });
  el.addEventListener('touchcancel',end);
})();
// 鏡頭縮放：＋／－／自動、滑鼠滾輪、雙指縮放；全螢幕
(function(){
  const on=(id,f)=>{ const b=document.getElementById(id); if(b) b.addEventListener('click',e=>{ e.preventDefault(); f(); }); };
  on('zm-in',()=>setZoomMul(zoomMul*1.15)); on('zm-out',()=>setZoomMul(zoomMul/1.15)); on('zm-auto',()=>setZoomMul(1)); on('zm-fs',toggleFullscreen);
  on('a2hs-close',()=>document.getElementById('a2hs-tip').classList.remove('show'));
  canvas.addEventListener('wheel',e=>{ if(!game) return; e.preventDefault(); setZoomMul(zoomMul*Math.exp(-Math.max(-300,Math.min(300,e.deltaY))*0.0015)); },{passive:false});
  let pinch=null;
  const pd=(ts)=>Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY);
  canvas.addEventListener('touchstart',e=>{ if(e.touches.length===2){ e.preventDefault(); pinch={d0:pd(e.touches),m0:zoomMul}; } },{passive:false});
  canvas.addEventListener('touchmove',e=>{ if(pinch&&e.touches.length===2){ e.preventDefault(); setZoomMul(pinch.m0*pd(e.touches)/Math.max(10,pinch.d0)); } },{passive:false});
  canvas.addEventListener('touchend',e=>{ if(e.touches.length<2) pinch=null; });
  updZoomUI();
})();

function toggleFullscreen(){
  const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req||/iPhone|iPod/.test(navigator.userAgent)) return showA2HS();
  try{ const r=req.call(el,{navigationUI:'hide'}); if(r&&r.catch) r.catch(()=>showA2HS()); }catch(e){ showA2HS(); }
  setTimeout(resize,300);
}

let charPreviewRaf=0;
function paintHumanoidPreview(canvas, cls, jobTier, scale, bob, playerLike){
  if(!canvas) return;
  const c=canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  c.clearRect(0,0,w,h);
  // soft ground disc
  c.fillStyle='rgba(139,105,20,0.18)';
  c.beginPath();c.ellipse(w/2, h*0.78, w*0.28, h*0.06, 0, 0, Math.PI*2);c.fill();
  const src=playerLike||{cls:cls||'novice', job:(JOBS[cls]?cls:'novice'), jobTier:jobTier||0, facing:1};
  const opt=playerSpriteOpt(src);
  opt.scale=(scale||1.6)*(opt.scale||1);
  const yOff = bob ? Math.sin(bob)*2.5 : 0;
  drawHumanoid(w/2, h*0.62 + yOff, opt, c);
}
function drawSlotPreview(slotIndex, player){
  const canvas=document.getElementById('slot-preview-'+slotIndex);
  if(!canvas) return;
  if(!player){
    canvas.classList.add('empty-slot');
    const c=canvas.getContext('2d');
    c.clearRect(0,0,canvas.width,canvas.height);
    // faint placeholder silhouette
    c.fillStyle='rgba(139,105,20,0.2)';
    c.beginPath();c.ellipse(canvas.width/2, canvas.height*0.82, 14, 4, 0, 0, Math.PI*2);c.fill();
    c.fillStyle='rgba(90,64,48,0.25)';
    c.fillRect(canvas.width/2-8, canvas.height*0.35, 16, 22);
    c.beginPath();c.arc(canvas.width/2, canvas.height*0.3, 7, 0, Math.PI*2);c.fill();
    return;
  }
  canvas.classList.remove('empty-slot');
  paintHumanoidPreview(canvas, player.cls, jobTierOf(player), 1.05, 0, player);
}
function stopCharPreview(){
  if(charPreviewRaf){ cancelAnimationFrame(charPreviewRaf); charPreviewRaf=0; }
}
function startCharPreview(){
  stopCharPreview();
  const canvas=document.getElementById('char-preview');
  if(!canvas) return;
  const t0=performance.now();
  function frame(t){
    if(!document.getElementById('char-create').classList.contains('show')){
      charPreviewRaf=0; return;
    }
    const bob=((t-t0)/400);
    paintHumanoidPreview(canvas, selectedClass, 1, 1.85, bob);
    charPreviewRaf=requestAnimationFrame(frame);
  }
  charPreviewRaf=requestAnimationFrame(frame);
}
function refreshCharPreview(){
  const canvas=document.getElementById('char-preview');
  if(!canvas) return;
  if(document.getElementById('char-create').classList.contains('show')){
    if(!charPreviewRaf) startCharPreview();
    else paintHumanoidPreview(canvas, selectedClass, 1, 1.85, 0);
  }
}

function refreshSlotsUI(){
  const slots=loadAllSlots();
  for(let i=0;i<3;i++){
    const info=document.getElementById('slot-info-'+i);
    const card=document.querySelector(`.slot-card[data-slot="${i}"]`);
    if(!info||!card) continue;
    const btnCreate=card.querySelector('.btn-slot-create');
    const btnContinue=card.querySelector('.btn-slot-continue');
    const btnDelete=card.querySelector('.btn-slot-delete');
    const s=slots[i];
    if(s&&s.player){
      const p=s.player;
      const ji=jobInfo(p); // 舊存檔亦可（jobOf 依舊職業對應）
      const pid=(typeof p.id==='string'&&p.id)?p.id:String(p.name||'無名英雄');
      info.textContent='';
      const idSpan=document.createElement('span'); idSpan.className='slot-id'; idSpan.textContent=`ID：${pid}`;
      info.appendChild(idSpan);
      info.appendChild(document.createTextNode(`${ji.icon} ${p.name} · Lv.${p.level||1} ${ji.name}`));
      info.classList.remove('empty');
      if(btnCreate) btnCreate.style.display='none';
      if(btnContinue) btnContinue.style.display='inline-block';
      if(btnDelete) btnDelete.style.display='inline-block';
      drawSlotPreview(i, p);
    } else {
      info.textContent='（空欄位）';
      info.classList.add('empty');
      if(btnCreate) btnCreate.style.display='inline-block';
      if(btnContinue) btnContinue.style.display='none';
      if(btnDelete) btnDelete.style.display='none';
      drawSlotPreview(i, null);
    }
  }
}
function startGame(fromSave,slotIndex){
  if(slotIndex===undefined||slotIndex===null){
    slotIndex=fromSave?activeSlot:(pendingCreateSlot!==null?pendingCreateSlot:0);
  }
  if(slotIndex<0||slotIndex>2) return;
  chunkCache.clear();
  particles=[]; projectiles=[]; floatingTexts=[]; zones=[]; fxs=[]; summons=[]; skTimers=[];
  if(fromSave){
    const data=loadGame(slotIndex);
    if(!data||!data.player) return;
    activeSlot=slotIndex;
    game={player:data.player, groundLoot:Array.isArray(data.groundLoot)?data.groundLoot:[], auction:Array.isArray(data.auction)?data.auction:[]};
    // ensure quest object
    lockPlayerId(game.player); // 舊存檔遷移：缺 id → 以當前名字補上一次，之後永久鎖定
    if(!game.player.quest) game.player.quest={id:'starter',kills:0,herbs:0,status:'inactive'};
    // SAVE_KEY v1 compatible: legacy saves skip tutorial / start at jobTier 1
    if(game.player.tutorialDone===undefined) game.player.tutorialDone=true;
    if(game.player.jobTier===undefined) game.player.jobTier=1;
    for(const a of game.auction) if(a&&ITEM_ID_MIGRATE[a.itemId]) a.itemId=migItemId(a.itemId);
    for(const g of game.groundLoot) if(g&&ITEM_ID_MIGRATE[g.id]) g.id=migItemId(g.id);
    if(game.player.job&&!JOBS[game.player.job]&&JOB_RENAME[game.player.job]) game.player.job=JOB_RENAME[game.player.job];
    migrateJob(game.player); // 舊職業鏈（戰士/騎士/聖騎士…）→ 新職業樹
    ensureAttr(game.player); // 舊存檔沒有六屬性 → 各 5，保留目前職業
    ensureSkills(game.player);
    // 舊存檔可能仍是「自動升級剩量」語意；維持數值，改為手動從池扣
    game.player.expNext=expNeeded(game.player.level||1); // 新升級曲線；EXP 池保留
  } else {
    // 僅寫入選定的空欄位
    if(hasSave(slotIndex)){
      msg('此欄位已有存檔，請先刪除或選其他欄位');
      return;
    }
    const name=document.getElementById('player-name').value.trim().replace(/\s+/g,' ').slice(0,12)||'無名英雄';
    const takenBy=charIdTaken(name,curAcct,slotIndex), taken=!!takenBy; // 角色 ID 跨帳號全域唯一
    if(taken){
      msg(takenBy===curAcct?`❌ 角色ID「${name}」已被其他欄位使用，請換一個`:`❌ 角色ID「${name}」已被其他帳號使用，請換一個`);
      const hint=document.getElementById('create-slot-hint');
      if(hint) hint.textContent=`❌ 角色ID「${name}」已存在，請換一個（ID 建立後永久不可更改）`;
      return;
    }
    activeSlot=slotIndex;
    game={player:makePlayer(name), groundLoot:[], auction:[]}; // tutorialDone:false — must talk to 冒險主
  }
  pendingCreateSlot=null;
  masterTutStep=0;
  // 大陸：讀取存檔中的所在大陸（舊存檔＝史坎布雷）
  applyContinent(game.player.continent||'scambray'); game.player.continent=curCont; chunkCache.clear(); atmos=[];
  ensureBot(game.player); botRt=botFresh(game.player);
  if(botOn(game.player)) setTimeout(()=>msg('🤖 自動練功已恢復（B 或移動鍵停止）'),600);
  ensureSkills(game.player);
  stopCharPreview();
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('hud').classList.add('active');
  document.getElementById('hint').classList.add('show');
  paused=false;
  updateHUD();
  msg(`歡迎來到${contOf().town}（${contLabel()}），${game.player.name}！`);
  showContBanner();
  if(!game.player.tutorialDone) msg('先找附近的「冒險主」對話，聽完教學再接任務！');
  else msg('找長者歐巴桑接任務吧！');
  saveGame();
}

// Title-screen ember particles (CSS/canvas only; pauses when hidden)
(function initTitleEmbers(){
  const canvas=document.getElementById('title-embers');
  const screen=document.getElementById('title-screen');
  if(!canvas||!screen) return;
  const ctx=canvas.getContext('2d');
  let w=0,h=0,embers=[],raf=0,running=false;
  function resize(){
    w=canvas.width=window.innerWidth;
    h=canvas.height=window.innerHeight;
  }
  function spawn(n){
    for(let i=0;i<n;i++){
      embers.push({
        x:Math.random()*w,
        y:h*(0.55+Math.random()*0.45),
        r:1+Math.random()*2.8,
        vy:-(0.35+Math.random()*1.4),
        vx:(Math.random()-0.5)*0.6,
        life:0.4+Math.random()*0.6,
        max:80+Math.random()*160,
        age:Math.random()*40,
        hue:25+Math.random()*25
      });
    }
  }
  function frame(){
    if(!running) return;
    ctx.clearRect(0,0,w,h);
    if(embers.length<70) spawn(2);
    for(let i=embers.length-1;i>=0;i--){
      const e=embers[i];
      e.age++; e.x+=e.vx; e.y+=e.vy;
      e.vx+=(Math.random()-0.5)*0.05;
      const t=e.age/e.max;
      const a=e.life*(1-t);
      if(t>=1||e.y<-20){embers.splice(i,1);continue}
      const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*3);
      g.addColorStop(0,`hsla(${e.hue},100%,70%,${a})`);
      g.addColorStop(0.4,`hsla(${e.hue},100%,50%,${a*0.55})`);
      g.addColorStop(1,`hsla(${e.hue},100%,40%,0)`);
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.arc(e.x,e.y,e.r*3,0,Math.PI*2);
      ctx.fill();
    }
    // Decorative dragon / shield totems flanking the title panel
    if(typeof drawTitleTotemDecor==='function') drawTitleTotemDecor(ctx,w,h,performance.now());
    raf=requestAnimationFrame(frame);
  }
  function start(){
    if(running) return;
    running=true; resize(); embers=[]; spawn(45);
    raf=requestAnimationFrame(frame);
  }
  function stop(){
    running=false;
    if(raf) cancelAnimationFrame(raf);
    ctx&&ctx.clearRect(0,0,w,h);
  }
  function sync(){
    if(screen.classList.contains('hidden')) stop(); else start();
  }
  window.addEventListener('resize',()=>{if(running)resize()});
  const obs=new MutationObserver(sync);
  obs.observe(screen,{attributes:true,attributeFilter:['class']});
  sync();
})();

// ===== 平衡與等級上限調整（v1 基準上） =====
(function(){
  const LV_CAP = 75;
  const ATTR_CAP = 120;

  // 等級超過 75 時，把多出來的等級轉回經驗
  function clampLevel(p){
    if(!p || !p.level) return;
    const lv = p.level|0;
    if(lv > LV_CAP){
      let refund = 0;
      for(let i = LV_CAP; i < lv; i++){
        refund += Math.floor(100*Math.pow(i,1.8)+50*Math.pow(1.06,i));
      }
      p.level = LV_CAP;
      p.exp = (p.exp|0) + refund;
      p.expNext = Math.floor(100*Math.pow(LV_CAP,1.8)+50*Math.pow(1.06,LV_CAP));
      console.log('等級已調整至', LV_CAP, '，返還經驗', refund);
    }
    // 屬性也限制
    if(p.attr){
      for(const k in p.attr){
        if(p.attr[k] > ATTR_CAP) p.attr[k] = ATTR_CAP;
      }
    }
  }

  // 人物傷害弱化 45%，怪物強化
  const origCalc = window.calcPlayerDamage || window.playerDamage;
  // 攔截常見傷害函式
  ['calcDamage','playerDamage','skillDamage','dealDamage'].forEach(fn=>{
    if(typeof window[fn]==='function'){
      const o = window[fn];
      window[fn] = function(...args){
        let d = o.apply(this, args);
        if(typeof d === 'number') d = Math.max(1, Math.floor(d * 0.55));
        return d;
      };
    }
  });

  // 定期強化怪物
  setInterval(()=>{
    if(typeof game==='undefined' || !game) return;
    const list = game.monsters || game.mobs || [];
    list.forEach(m=>{
      if(m && !m._bal){
        m.atk = Math.floor((m.atk||8) * 2.8);
        m.def = Math.floor((m.def||4) * 2.2);
        const hp = m.maxHp || m.hp || 80;
        m.hp = m.maxHp = Math.floor(hp * 2.2);
        m._bal = true;
      }
    });
  }, 1500);

  // 角色載入時套用等級限制
  const origEnter = window.acctEnter;
  if(typeof origEnter === 'function'){
    window.acctEnter = function(name){
      const r = origEnter.apply(this, arguments);
      setTimeout(()=>{
        if(typeof game!=='undefined' && game && game.player) clampLevel(game.player);
      }, 800);
      return r;
    };
  }

  // 也在遊戲開始時檢查
  setTimeout(()=>{
    if(typeof game!=='undefined' && game && game.player) clampLevel(game.player);
  }, 3000);

  console.log('平衡調整已套用：等級上限75、屬性75、人物傷害-45%、怪物強化');
})();


// ===== 進階調整：攻速、吟唱、等級系統 =====
(function(){
  const BASE_LV_CAP = 75;
  const ABS_LV_CAP = 120;
  const POST75_EXP = 100000000; // 1億經驗

  // 1. 人物攻速變慢（攻擊間隔拉長）
  const origAtkInterval = window.ATK_INTERVAL || 400;
  window.ATK_INTERVAL = Math.max(origAtkInterval, 650);
  
  // 攔截攻擊函式加冷卻
  let lastAtk = 0;
  const origDoAttack = window.doAttack || window.playerAttack;
  if(typeof origDoAttack === 'function'){
    window.doAttack = window.playerAttack = function(...args){
      const now = Date.now();
      if(now - lastAtk < 650) return;
      lastAtk = now;
      return origDoAttack.apply(this, args);
    };
  }

  // 2. 法師法術加吟唱時間
  window.CAST_TIME = {
    fireball: 1200,
    icebolt: 1000,
    lightning: 1500,
    heal: 800,
    default: 1000
  };
  
  // 3. 等級系統：75後需熟練度+1億經驗
  const origGainExp = window.gainExp;
  if(typeof origGainExp === 'function'){
    window.gainExp = function(p, amt){
      if(!p) return;
      const lv = p.level|0;
      if(lv >= ABS_LV_CAP) return; // 已滿級
      
      if(lv >= BASE_LV_CAP){
        // 75級後：需要熟練度條件 + 大量經驗
        p.post75Exp = (p.post75Exp||0) + (amt||0);
        if(p.post75Exp >= POST75_EXP && (p.proficiency||0) >= (lv - BASE_LV_CAP + 1) * 10){
          p.level++;
          p.post75Exp = 0;
          // 每升一級全屬性+1
          if(p.attr){
            for(const k in p.attr){
              p.attr[k] = Math.min(120, (p.attr[k]|0) + 1);
            }
          }
          if(typeof msg === 'function') msg('🎉 等級提升至 ' + p.level + '！全屬性+1');
        }
        return;
      }
      return origGainExp(p, amt);
    };
  }

  // 4. 稻草人在75級後無法升級
  const origScarecrow = window.useScarecrow || window.scarecrowExp;
  if(typeof origScarecrow === 'function'){
    window.useScarecrow = window.scarecrowExp = function(p, ...args){
      if(p && (p.level|0) >= BASE_LV_CAP){
        if(typeof msg === 'function') msg('⚠️ 75級後無法使用稻草人升級');
        return false;
      }
      return origScarecrow.apply(this, [p, ...args]);
    };
  }

  console.log('進階調整已套用：攻速減緩、法術吟唱、75-120等級系統');
})();


// ===== 裝備實裝化 + 隨機屬性 + 熟練度百分比 =====
(function(){
  // 1. 熟練度百分比顯示
  function updateProficiencyUI(){
    if(typeof game === 'undefined' || !game || !game.player) return;
    const p = game.player;
    const lv = p.level|0;
    let pct = 0;
    if(lv >= 75){
      const need = 100000000;
      pct = Math.min(100, Math.floor(((p.post75Exp||0) / need) * 100));
    } else {
      const need = Math.floor(100*Math.pow(lv,1.8)+50*Math.pow(1.06,lv));
      pct = Math.min(100, Math.floor(((p.exp||0) / need) * 100));
    }
    // 更新或建立熟練度欄位
    let el = document.getElementById('prof-pct');
    if(!el){
      el = document.createElement('div');
      el.id = 'prof-pct';
      el.style.cssText = 'position:fixed;top:60px;left:10px;background:rgba(0,0,0,0.7);color:#ffd700;padding:4px 8px;border-radius:4px;font-size:12px;z-index:100;';
      document.body.appendChild(el);
    }
    el.textContent = '熟練度 ' + pct + '%';
  }
  setInterval(updateProficiencyUI, 1000);

  // 2. 裝備隨機屬性
  window.rollEquipAffix = function(item){
    if(!item || item._affixed) return item;
    const affixes = [
      {k:'atk', name:'攻擊', min:1, max:8},
      {k:'def', name:'防禦', min:1, max:5},
      {k:'hp', name:'生命', min:5, max:30},
      {k:'mp', name:'魔力', min:3, max:15},
      {k:'crit', name:'暴擊', min:1, max:3}
    ];
    const count = Math.random() < 0.3 ? 2 : 1;
    item.affixes = [];
    for(let i = 0; i < count; i++){
      const a = affixes[Math.floor(Math.random()*affixes.length)];
      const val = a.min + Math.floor(Math.random()*(a.max-a.min+1));
      item.affixes.push({k:a.k, name:a.name, val});
    }
    item._affixed = true;
    return item;
  };

  // 3. 裝備實裝化（簡易：在角色旁顯示裝備圖示）
  function renderEquipVisual(){
    if(typeof game === 'undefined' || !game || !game.player) return;

      box = document.createElement('div');

      const eq = p.equip && p.equip[s];
      const icon = eq ? (eq.icon || '⚔️') : '▫️';
      return '<span title="'+s+'" style="background:rgba(0,0,0,0.6);padding:4px;border-radius:4px;font-size:16px;">'+icon+'</span>';
    }).join('');
  }
  setInterval(renderEquipVisual, 2000);

  console.log('裝備實裝化、隨機屬性、熟練度百分比已啟用');
})();


// ===== UI 調整：血條位置 + 包包 100 格 =====
(function(){
  // 1. 血條往上移，避免擋住任務欄
  function fixHpBar(){
    const hp = document.querySelector('.hp-bar, #hp-bar, [class*="hp"]');
    const bars = document.querySelectorAll('#hud-hp, .bar-hp, .hpbar');
    bars.forEach(el => {
      if(el) el.style.marginBottom = '8px';
    });
    // 任務欄往下移一點
    const quest = document.querySelector('#quest-panel, .quest-box, [id*="quest"]');
    if(quest) quest.style.marginTop = '12px';
  }
  setTimeout(fixHpBar, 1500);
  setInterval(fixHpBar, 5000);

  // 2. 包包擴充至 100 格
  const INV_SIZE = 100;
  function expandInv(){
    if(typeof game === 'undefined' || !game || !game.player) return;
    const p = game.player;
    if(!p.inv) p.inv = [];
    while(p.inv.length < INV_SIZE) p.inv.push(null);
    // 如果有背包 UI，嘗試擴充顯示
    const invGrid = document.querySelector('#inv-grid, .inv-slots, [class*="inventory"]');
    if(invGrid && invGrid.children.length < INV_SIZE){
      // 標記已擴充
      invGrid.dataset.expanded = '1';
    }
  }
  setInterval(expandInv, 2000);

  console.log('UI 調整：血條位置、包包 100 格');
})();


// ===== UI 修正：等級/熟練度、血條對齊、包包分頁 =====
(function(){
  // 1. 角色欄位顯示等級與熟練度
  function showLvProf(){
    if(typeof game === 'undefined' || !game || !game.player) return;
    const p = game.player;
    const lv = p.level|0;
    let pct = 0;
    if(lv >= 75){
      pct = Math.min(100, Math.floor(((p.post75Exp||0) / 100000000) * 100));
    } else {
      const need = Math.floor(100*Math.pow(Math.max(1,lv),1.8)+50*Math.pow(1.06,lv));
      pct = Math.min(100, Math.floor(((p.exp||0) / Math.max(1,need)) * 100));
    }
    // 在角色資訊區加上等級
    let lvEl = document.getElementById('char-lv-display');
    if(!lvEl){
      lvEl = document.createElement('div');
      lvEl.id = 'char-lv-display';
      lvEl.style.cssText = 'position:fixed;top:95px;left:8px;background:rgba(20,16,10,0.85);color:#ffd700;padding:3px 8px;border-radius:4px;font-size:11px;z-index:200;border:1px solid #c9a227;';
      document.body.appendChild(lvEl);
    }
    lvEl.textContent = 'Lv.' + lv + '  熟練 ' + pct + '%';
  }
  setInterval(showLvProf, 800);

  // 2. 血條貼齊任務欄右邊
  function alignHp(){
    const hpBox = document.querySelector('#hud, .hud-bars, [id*="hp-box"]');
    const quest = document.querySelector('#quest-log, .quest-panel, [class*="quest"]');
    if(hpBox && quest){
      const qRect = quest.getBoundingClientRect();
      hpBox.style.position = 'absolute';
      hpBox.style.left = (qRect.right + 4) + 'px';
      hpBox.style.top = qRect.top + 'px';
    }
  }
  setTimeout(alignHp, 2000);
  setInterval(alignHp, 4000);

  // 3. 包包 100 格分 3 頁
  window.INV_PAGES = 3;
  window.INV_PER_PAGE = 34; // 約 100/3
  window.currentInvPage = 0;

  function setupInvPages(){
    if(typeof game === 'undefined' || !game || !game.player) return;
    const p = game.player;
    if(!p.inv) p.inv = [];
    while(p.inv.length < 100) p.inv.push(null);

    // 加分頁按鈕
    let pager = document.getElementById('inv-pager');
    if(!pager){
      pager = document.createElement('div');
      pager.id = 'inv-pager';
      pager.style.cssText = 'position:fixed;bottom:140px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:300;';
      for(let i = 0; i < 3; i++){
        const btn = document.createElement('button');
        btn.textContent = '第' + (i+1) + '頁';
        btn.style.cssText = 'padding:4px 10px;background:#3a2a10;color:#ffd700;border:1px solid #c9a227;border-radius:4px;font-size:11px;';
        btn.onclick = () => { window.currentInvPage = i; };
        pager.appendChild(btn);
      }
      document.body.appendChild(pager);
    }
  }
  setTimeout(setupInvPages, 2500);
  setInterval(setupInvPages, 8000);

  console.log('UI 修正：等級熟練度、血條對齊、包包分頁');
})();

</script>
