<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="萬王之王">
<meta name="theme-color" content="#1a1208">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>萬王之王</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;background:#1a1208;font-family:"Noto Serif TC","Microsoft JhengHei","PingFang TC",serif;-webkit-text-size-adjust:100%}
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--mm:195px}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#sa-probe{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* 縮放／全螢幕按鈕（遊戲中） */
#zoom-ctl{position:absolute;right:calc(10px + var(--sar));top:calc(var(--mm) + 22px + var(--sat));display:flex;flex-direction:column;gap:6px;pointer-events:auto;z-index:7}
#zoom-ctl button{width:38px;height:38px;border-radius:9px;border:2px solid #c9a227;background:rgba(26,18,8,.72);color:#ffe08a;font-size:1.15rem;font-weight:bold;line-height:1;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;padding:0}
#zoom-ctl button:active{background:rgba(201,162,39,.75);color:#1a1208}
#zoom-ctl #zm-auto{font-size:.62rem}
#zoom-ctl #zm-auto.auto{color:#9fe09f}
#a2hs-tip{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);display:none;padding:12px 14px;font-size:.85rem;line-height:1.5}
#a2hs-tip.show{display:block}
/* 小螢幕（手機）：HUD 縮小，不擋畫面 */
body.ui-s #hud-top{transform:scale(.64);transform-origin:top left}
body.ui-s #hud-quest{transform:scale(.68);transform-origin:top right;max-width:200px}
body.ui-s #msg-log{bottom:calc(64px + var(--sab));font-size:.72rem;width:min(320px,80vw)}
@media (orientation:landscape){body.ui-s #msg-log{bottom:calc(64px + var(--sab));width:min(300px,46vw)}}
body.ui-s #hint{display:none!important}
body.ui-s #zoom-ctl button{width:32px;height:32px;font-size:1rem}
body.ui-s #online-list{left:auto;right:calc(8px + var(--sar));top:calc(8px + var(--sat));max-height:50vh;font-size:.7rem}
canvas{display:block;width:100%;height:100%;background:#2a1f0e}

/* Screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,#3d2b14 0%,#1a1208 70%)}
.screen.hidden{display:none}
.parchment{background:linear-gradient(160deg,#f5e6c8 0%,#e8d4a8 40%,#d4c090 100%);border:4px solid #c9a227;border-radius:8px;box-shadow:0 0 0 3px #8b6914,0 8px 32px rgba(0,0,0,.6),inset 0 0 40px rgba(139,105,20,.15);padding:28px 36px;max-width:92vw;text-align:center;position:relative}
.parchment::before,.parchment::after{content:"";position:absolute;width:18px;height:18px;border:3px solid #c9a227;background:#8b6914}
.parchment::before{top:-6px;left:-6px;border-radius:2px}
.parchment::after{bottom:-6px;right:-6px;border-radius:2px}
.corner-tr,.corner-bl{position:absolute;width:18px;height:18px;border:3px solid #c9a227;background:#8b6914;border-radius:2px}
.corner-tr{top:-6px;right:-6px}.corner-bl{bottom:-6px;left:-6px}

h1.title{font-size:clamp(2rem,8vw,3.2rem);color:#6b1a1a;text-shadow:2px 2px 0 #c9a227,0 0 20px rgba(201,162,39,.4);letter-spacing:.15em;margin-bottom:4px}
.subtitle{color:#8b6914;font-size:.95rem;margin-bottom:18px;font-style:italic}
.tagline{color:#5a4030;font-size:.8rem;margin-bottom:16px}

input[type=text]{width:min(260px,70vw);padding:10px 14px;font-size:1rem;border:2px solid #8b6914;border-radius:4px;background:#fff8e7;color:#3d2b14;text-align:center;font-family:inherit;outline:none}
input[type=text]:focus{border-color:#c9a227;box-shadow:0 0 8px rgba(201,162,39,.5)}

.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;max-width:340px}
.class-btn{padding:12px 10px;border:2px solid #8b6914;border-radius:6px;background:linear-gradient(180deg,#fff8e7,#efe0c0);cursor:pointer;font-family:inherit;font-size:.95rem;color:#3d2b14;transition:all .15s;line-height:1.4}
.class-btn:hover{border-color:#c9a227;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.class-btn.selected{border-color:#c9a227;background:linear-gradient(180deg,#ffe08a,#e8c040);box-shadow:0 0 12px rgba(201,162,39,.5);font-weight:bold}
.class-btn .icon{font-size:1.6rem;display:block;margin-bottom:4px}
.class-btn .desc{font-size:.7rem;color:#6b5040;font-weight:normal}

.btn{padding:12px 36px;font-size:1.1rem;font-family:inherit;font-weight:bold;color:#fff8e7;background:linear-gradient(180deg,#8b1a1a,#5a1010);border:3px solid #c9a227;border-radius:6px;cursor:pointer;letter-spacing:.1em;box-shadow:0 4px 0 #3d0808,0 6px 16px rgba(0,0,0,.4);transition:all .1s;margin:6px}
.btn:hover{background:linear-gradient(180deg,#a82020,#6b1414);transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3d0808}
.btn.secondary{background:linear-gradient(180deg,#5a4030,#3d2b14);box-shadow:0 4px 0 #1a1208,0 6px 16px rgba(0,0,0,.4)}
.scare-tabs{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.scare-tabs .btn{flex:1;min-width:72px}
.scare-tabs .btn.on{outline:2px solid #e8c060;color:#ffe08a}
#attr-ro{margin:1px 0 2px;font-size:10px;line-height:1.2;color:#cbb892}
#attr-ro .ar{display:flex;gap:6px}
#attr-ro .ar span{white-space:nowrap}
#attr-ro .ar b{margin-left:2px;color:#f0e2c0}
#attr-ro b{color:#f0e2c0;font-weight:600}
#attr-ro-m{display:none}
body.ui-s #attr-ro-m{display:block;position:fixed;left:calc(4px + var(--sal));top:calc(72px + var(--sat));z-index:24;width:132px;padding:3px 5px;font-size:9px;line-height:1.3;color:#cbb892;background:rgba(10,8,6,.82);border:1px solid rgba(180,140,60,.45);pointer-events:none}
body.ui-s #attr-ro-m .ar{display:flex;flex-wrap:wrap;gap:0 5px}body.ui-s #attr-ro-m .ar span{white-space:nowrap}
body.ui-s #attr-ro-m b{color:#f0e2c0}

.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.active{display:block}
.hud-panel{pointer-events:auto;position:absolute;background:linear-gradient(160deg,rgba(245,230,200,.92),rgba(212,192,144,.92));border:3px solid #c9a227;border-radius:6px;box-shadow:0 0 0 2px #8b6914,0 4px 16px rgba(0,0,0,.5);padding:8px 12px;font-size:.8rem;color:#3d2b14}
#hud-top{top:calc(8px + var(--sat));left:calc(8px + var(--sal));min-width:200px} /* top-left character info */
#hud-top .name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#hud-top .name{font-weight:bold;font-size:.95rem;color:#6b1a1a;cursor:pointer;border-radius:3px;padding:1px 2px}
#hud-top .name:hover{background:rgba(201,162,39,.22);text-decoration:underline}
#hud-top #btn-rename{pointer-events:auto;border:1px solid #8b6914;background:linear-gradient(180deg,#f0d878,#c9a227);color:#3d2b14;border-radius:4px;padding:0 5px;font-size:.85rem;line-height:1.4;cursor:pointer;box-shadow:0 2px 0 #8b6914}
#hud-top #btn-rename:hover{filter:brightness(1.08)}
#hud-top .id-row{font-size:.78rem;color:#5a4030;margin-bottom:2px;user-select:text}
#hud-top .id-row b{color:#3d2b14}
.slot-card .slot-id{display:block;font-size:.75rem;color:#5a4030}
#hud-top .stats{margin-top:4px;line-height:1.5}
#cont-banner{position:fixed;left:50%;top:25%;transform:translateX(-50%);z-index:4;pointer-events:none;text-align:center;opacity:0;--cb-col:#ffd060;white-space:nowrap}
#cont-banner.show{animation:cbIn 3.8s ease-out forwards}
#cont-banner .cb-tier{font-size:1rem;letter-spacing:.3em;color:#f5e6c8;text-shadow:0 2px 6px #000}
#cont-banner .cb-name{font-size:clamp(2rem,6vw,3.6rem);font-weight:900;letter-spacing:.12em;color:var(--cb-col);text-shadow:0 0 18px var(--cb-col),0 3px 0 #2a1a08,0 6px 16px rgba(0,0,0,.8);font-family:"Noto Serif TC","Microsoft JhengHei",serif}
#cont-banner .cb-sub{margin-top:4px;font-size:.95rem;color:#f5e6c8;text-shadow:0 2px 6px #000}
#cont-banner .cb-name::before,#cont-banner .cb-name::after{content:'';display:inline-block;width:2.2em;height:2px;vertical-align:middle;margin:0 .5em;background:linear-gradient(90deg,transparent,var(--cb-col))}
#cont-banner .cb-name::after{background:linear-gradient(90deg,var(--cb-col),transparent)}
@keyframes cbIn{0%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.96)}14%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-8px)}}
.bot-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}
#btn-bot{pointer-events:auto;border:1px solid #8b6914;background:linear-gradient(180deg,#f0e0b0,#d4bc80);color:#3d2b14;border-radius:4px;padding:1px 6px;font-size:.72rem;cursor:pointer;box-shadow:0 2px 0 #8b6914}
#btn-bot.on{background:linear-gradient(180deg,#a0e8a0,#50b050);color:#0e2a0e;border-color:#2a6a2a;box-shadow:0 2px 0 #2a6a2a}
#bot-chip{font-size:.68rem;font-weight:bold;padding:1px 6px;border-radius:9px;background:#2a6a2a;color:#e8ffe8;max-width:260px;white-space:normal}
#bot-chip.on{animation:botPulse 1.4s ease-in-out infinite}
#bot-chip.wait{background:#8a5a10;color:#fff4d0}
@keyframes botPulse{0%,100%{box-shadow:0 0 0 rgba(80,200,80,0)}50%{box-shadow:0 0 8px rgba(80,220,80,.9)}}
.cont-row{font-size:.72rem;font-weight:bold;color:#5a2a08;margin-top:2px}
#hud-buffs{margin-top:6px;min-height:0;display:flex;flex-wrap:wrap;gap:4px}
#hud-buffs:empty{display:none}
.buff-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;font-size:.68rem;font-weight:bold;color:#f5e6c8;background:rgba(26,18,8,.78);border:1px solid #c9a227;border-radius:10px;box-shadow:inset 0 0 6px rgba(201,162,39,.25);white-space:nowrap;line-height:1.3}
.buff-chip .bt{color:#ffe08a;font-variant-numeric:tabular-nums}
.bar{height:12px;background:#3d2b14;border-radius:3px;border:1px solid #8b6914;margin:3px 0;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:2px;transition:width .2s}
.bar-hp .bar-fill{background:linear-gradient(180deg,#e04040,#a02020)}
.bar-mp .bar-fill{background:linear-gradient(180deg,#4080e0,#2040a0)}
.bar-exp .bar-fill{background:linear-gradient(180deg,#e0c040,#a08020)}
.bar-rage{height:9px}
.bar-rage .bar-fill{background:linear-gradient(180deg,#ff7a30,#b02010);transition:width .15s}
.bar-rage.full .bar-fill{background:linear-gradient(180deg,#ffb040,#ff3010);box-shadow:0 0 6px #ff6020}
.bar-rage .bar-label{font-size:.58rem}
.bar-shield{position:absolute;top:0;left:0;height:100%;background:repeating-linear-gradient(135deg,rgba(255,244,190,.85) 0 4px,rgba(255,215,90,.75) 4px 8px);border-right:2px solid #fff;border-radius:2px;pointer-events:none;transition:width .15s}
.combo-row{display:flex;align-items:center;gap:4px;font-size:.68rem;color:#6b1a1a;font-weight:bold;margin:2px 0}
.combo-row .pip{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #8b4a10;background:rgba(61,43,20,.35);margin-right:2px;vertical-align:middle}
.combo-row .pip.on{background:radial-gradient(circle at 35% 35%,#ffe080,#ff8020);box-shadow:0 0 4px #ffa040}
.combo-row.max .pip.on{background:radial-gradient(circle at 35% 35%,#fff0a0,#ff3010);box-shadow:0 0 6px #ff4010}
.bar-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#fff;text-shadow:0 0 2px #000;font-weight:bold}

#hud-quest{top:calc(var(--mm) + 25px + var(--sat));right:calc(56px + var(--sar));max-width:220px;font-size:.75rem;white-space:pre-line} /* below top-right minimap */
#hud-quest .qtitle{font-weight:bold;color:#6b1a1a;margin-bottom:4px}
#msg-log{bottom:100px;left:50%;transform:translateX(-50%);width:min(400px,90vw);text-align:center;background:transparent;border:none;box-shadow:none;pointer-events:none;padding:0}
.msg{background:rgba(26,18,8,.75);color:#f5e6c8;padding:4px 12px;margin:3px 0;border-radius:4px;border:1px solid #8b6914;font-size:.8rem;animation:fadeMsg 4s forwards}
@keyframes fadeMsg{0%,70%{opacity:1}100%{opacity:0}}

/* Inventory overlay */
#inv-overlay,#dialog-overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#inv-overlay.open,#dialog-overlay.open{display:flex}
.inv-panel{background:linear-gradient(160deg,#f5e6c8,#e8d4a8);border:4px solid #c9a227;border-radius:8px;padding:20px;max-width:90vw;width:360px;box-shadow:0 0 0 3px #8b6914,0 8px 32px rgba(0,0,0,.6);color:#3d2b14}
.inv-panel h2{text-align:center;color:#6b1a1a;margin-bottom:12px;font-size:1.3rem}
.inv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.inv-slot{aspect-ratio:1;background:#fff8e7;border:2px solid #8b6914;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.7rem;cursor:default;position:relative}
.inv-slot .ic{font-size:1.4rem}
.inv-slot .qty{position:absolute;bottom:2px;right:4px;font-size:.65rem;font-weight:bold;color:#6b1a1a}
.inv-info{font-size:.8rem;text-align:center;margin-bottom:10px;min-height:3.6em;color:#5a4030;white-space:pre-line;line-height:1.35}
.equip-row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px}
.equip-slot{aspect-ratio:1;background:#efe0c0;border:2px dashed #8b6914;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;cursor:pointer;position:relative;color:#5a4030}
.equip-slot.filled{border-style:solid;background:#fff8e7;border-color:#c9a227}
.equip-slot .eq-lab{font-size:.55rem;opacity:.75;margin-top:2px}
.equip-slot .ic{font-size:1.2rem;line-height:1}
.inv-slot.gear{border-color:#6a8a40}
.inv-slot .eq-tag{position:absolute;top:1px;left:2px;font-size:.5rem;color:#6b1a1a;font-weight:bold}
.dialog-text{font-size:.95rem;line-height:1.6;margin-bottom:16px;text-align:left;max-height:40vh;overflow-y:auto;white-space:pre-line}
.dialog-opts{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto}
.dialog-opts .btn{width:100%;margin:0;font-size:.9rem;padding:10px}

/* Job tree (read-only viewer opened from #hud-top) */
#hud-top .job-link{font-weight:bold;font-size:.82rem;color:#3d2b14;cursor:pointer;border:1px solid #8b6914;border-radius:4px;padding:0 6px;line-height:1.5;background:rgba(255,248,231,.65);white-space:nowrap}
#hud-top .job-link:hover{background:rgba(201,162,39,.38);text-decoration:underline}
#hud-top #btn-jobtree{pointer-events:auto;border:1px solid #8b6914;background:linear-gradient(180deg,#3d2b14,#1a1208);color:#ffe08a;border-radius:4px;padding:0 6px;font-size:.72rem;line-height:1.6;cursor:pointer;box-shadow:0 2px 0 #8b6914;font-family:inherit;white-space:nowrap;position:relative}
#hud-top #btn-jobtree:hover{filter:brightness(1.25)}
#hud-top #btn-jobtree.ready::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:#7fe07f;box-shadow:0 0 6px #7fe07f;border:1px solid #1a1208}
#jobtree-overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);padding:8px}
#jobtree-overlay.open{display:flex}
.jt-panel{position:relative;width:min(980px,100%);max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);display:flex;flex-direction:column;background:linear-gradient(170deg,#2c1f0f 0%,#1a1208 55%,#120c05 100%);border:3px solid #c9a227;border-radius:8px;box-shadow:0 0 0 2px #8b6914,0 10px 40px rgba(0,0,0,.75),inset 0 0 40px rgba(201,162,39,.08);color:#f5e6c8;overflow:hidden}
.jt-head{display:flex;align-items:center;gap:6px 8px;padding:9px 12px;border-bottom:1px solid rgba(201,162,39,.45);flex-wrap:wrap}
.jt-head h2{font-size:1.1rem;color:#ffe08a;text-shadow:0 0 8px rgba(201,162,39,.45);margin-right:auto;letter-spacing:.08em}
.jt-head h2 small{font-size:.68rem;color:#c9b080;letter-spacing:0;font-weight:normal;margin-left:6px}
.jt-btn{font-family:inherit;font-size:.72rem;color:#ffe08a;background:rgba(61,43,20,.85);border:1px solid #8b6914;border-radius:4px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.jt-btn:hover{border-color:#ffe08a}
.jt-x{font-family:inherit;font-size:1rem;line-height:1;width:30px;height:30px;color:#3d2b14;background:linear-gradient(180deg,#f0d878,#c9a227);border:1px solid #8b6914;border-radius:50%;cursor:pointer;box-shadow:0 2px 0 #8b6914;flex:0 0 auto}
.jt-x:hover{filter:brightness(1.1)}
.jt-ladder{display:flex;flex-wrap:wrap;gap:4px 5px;align-items:center;font-size:.7rem;padding:6px 12px;color:#d8c49a;border-bottom:1px solid rgba(201,162,39,.2)}
.jt-ladder .step{border:1px solid #6a5020;border-radius:10px;padding:1px 8px;background:rgba(0,0,0,.3);white-space:nowrap}
.jt-ladder .step.done{border-color:#ffd24a;color:#ffe08a;background:rgba(201,162,39,.22)}
.jt-ladder .step.nx{border:1px dashed #7fe07f;color:#b8f0b8}
.jt-ladder .arr{color:#8b6914}
.jt-legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-left:auto;font-size:.64rem;color:#bfa878}
.jt-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px}
.jt-body{overflow:auto;padding:10px 12px;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.jt-root{display:flex;flex-direction:column;align-items:center;margin-bottom:4px}
.jt-root .jt-node{width:auto;min-width:180px;justify-content:center}
.jt-root .jt-down{color:#c9a227;font-size:.8rem;line-height:1.2}
.jt-branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:720px){.jt-branches{grid-template-columns:1fr}.jt-legend{margin-left:0}}
.jt-branch{border:1px solid rgba(201,162,39,.45);border-radius:6px;padding:7px;background:rgba(0,0,0,.25)}
.jt-branch.onpath{border-color:#ffd24a;box-shadow:inset 0 0 14px rgba(255,210,74,.12)}
.jt-tier{font-size:.62rem;color:#c9a227;letter-spacing:.06em;margin:7px 0 3px;display:flex;justify-content:space-between}
.jt-tier:first-child{margin-top:0}
.jt-tier b{color:#ffe08a;font-weight:normal}
.jt-node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;font-family:inherit;font-size:.8rem;color:#f5e6c8;background:rgba(61,43,20,.75);border:1px solid #8b6914;border-radius:5px;padding:5px 7px;cursor:pointer;line-height:1.25;min-height:32px}
.jt-node:hover,.jt-node:focus-visible,.jt-node.sel{border-color:#ffe08a;box-shadow:0 0 7px rgba(255,224,138,.55);outline:none}
.jt-node .ic{font-size:1rem;flex:0 0 auto}
.jt-node .nm{font-weight:bold;flex:1 1 auto;min-width:0}

#chat-input::placeholder{color:#8a7c64}
#chat-send{flex:none;height:24px;padding:0 12px;border:1px solid #c9a227;border-radius:2px;background:linear-gradient(180deg,#76623e,#3a2f20);color:#ffe9a8;font:bold .68rem "Microsoft JhengHei",sans-serif;cursor:pointer}
#chat-send:active{filter:brightness(1.3)}
#chat-box.collapsed{flex:none;margin-top:auto}
#chat-head{overflow:visible}
#chat-tabs{display:flex;gap:2px;align-items:flex-end;flex:1;min-width:0;overflow-x:auto;overflow-y:visible;scrollbar-width:none;padding-top:6px;margin-top:-6px}
#chat-addtab{height:18px;width:22px;border:1px solid #5c5346;border-radius:2px;background:linear-gradient(180deg,#2e2822,#16120e);color:#ffe9a8;font-size:.7rem;cursor:pointer;padding:0;margin:0 2px 1px}
#chat-head .ctab.cus{border-style:dashed}
#chat-ch{flex:none;height:24px;padding:0 8px;border:1px solid #6e5e48;border-radius:2px;background:linear-gradient(180deg,#2e3a52,#18202e);color:#cfe4ff;font:bold .64rem "Microsoft JhengHei",sans-serif;cursor:pointer}
#chat-ch.c{background:linear-gradient(180deg,#2e4a2a,#162414);color:#d6ffc8}
/* 拖曳調整大小的把手（上緣＋右上角） */
.chat-grip{position:absolute;z-index:3;touch-action:none}
.chat-grip.n{left:24px;right:24px;top:-5px;height:10px;cursor:ns-resize}
.chat-grip.n::after{content:'';position:absolute;left:50%;top:3px;width:46px;height:4px;margin-left:-23px;border-radius:2px;background:linear-gradient(90deg,#6e5e48,#c9a227,#6e5e48);opacity:.75}
.chat-grip.ne{right:-5px;top:-5px;width:16px;height:16px;cursor:nesw-resize}
.chat-grip.ne::after{content:'';position:absolute;right:5px;top:5px;width:8px;height:8px;border-top:2px solid #c9a227;border-right:2px solid #c9a227}
#chat-box.collapsed .chat-grip{display:none}
#chat-box.resizing{outline:1px solid #c9a227}
/* 桌機／平板：聊天窗固定在底欄正中，底邊對齊，可往上長高 */
body:not(.ui-s) #dock-mid{position:relative;overflow:visible}
body:not(.ui-s) #chat-box{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:var(--chat-w,560px);height:var(--chat-h,150px);flex:none;z-index:4}
body:not(.ui-s) #chat-box.collapsed{height:auto}
body:not(.ui-s) #msg-log{bottom:calc(var(--dock-h) + 8px + var(--sab) + var(--chat-over,0px)) !important}
/* 自訂分頁編輯 */
#chat-tabed{display:none;position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);width:220px;z-index:6;padding:8px 10px;background:linear-gradient(180deg,#2e2822,#14110e);border:1px solid #c9a227;border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.6);color:#f4ecd8;font-size:.72rem}
#chat-tabed.open{display:block}
#chat-tabed .te-t{color:#ffe9a8;font-weight:bold;margin-bottom:5px}
#chat-tabed #te-name{width:100%;box-sizing:border-box;height:24px;margin-bottom:5px;background:#100d0a;color:#f4ecd8;border:1px solid #8d7350;border-radius:2px;padding:0 6px;font-size:16px}
#chat-tabed label{margin-right:8px;white-space:nowrap;cursor:pointer}
#chat-tabed .te-b{display:flex;gap:4px;margin-top:6px}
#chat-tabed .te-b button{flex:1;height:24px;border:1px solid #a89060;border-radius:2px;background:linear-gradient(180deg,#6a5838,#3a2f20);color:#ffe9a8;font-size:.7rem;cursor:pointer}
#chat-tabed #te-del{background:linear-gradient(180deg,#7a2a20,#3a1410)}
body.ui-s #chat-tabed{bottom:auto;top:28px;width:min(260px,90vw)}
body.ui-s .chat-grip.ne{display:none}
body.ui-s .chat-grip.n{top:-10px;height:20px;left:30%;right:30%}
body.ui-s #chat-ch{height:32px}
#chat-box.collapsed #chat-row{display:none}
#chat-box.collapsed #chat-log{flex:none;height:calc(2 * 1.38em + 4px);overflow:hidden}
/* 手機（ui-s）：收合＝底欄內只顯示最新 2 行；點一下展開成完整聊天（分頁＋輸入），控制鈕跟著上移 */
body.ui-s #chat-box{max-width:none;font-size:.6rem}
body.ui-s #chat-box.collapsed{cursor:pointer;margin-top:0;align-self:stretch;flex:1;justify-content:center}
body.ui-s #chat-box.collapsed #chat-head{display:none}
body.ui-s #chat-box.collapsed #chat-log{line-height:1.3;height:calc(2 * 1.3em + 2px);padding:1px 6px}
body.ui-s #chat-box.collapsed #chat-log .cl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.ui-s #dock.chat-open{height:calc(var(--chat-dock) + var(--sab))}
body.ui-s #dock.chat-open #dock-row{flex-direction:column-reverse;gap:3px}
body.ui-s #dock.chat-open #dock-left{max-width:none;flex:none}
body.ui-s #dock.chat-open #dock-mid{flex:1;align-items:stretch}
body.ui-s:has(#dock.chat-open) .joy{bottom:calc(var(--chat-dock) + 8px + var(--sab))}
body.ui-s:has(#dock.chat-open) .atk-btn{bottom:calc(var(--chat-dock) + 14px + var(--sab))}
body.ui-s:has(#dock.chat-open) .act-btns{bottom:calc(var(--chat-dock) + 12px + var(--sab))}
body.ui-s:has(#dock.chat-open) #msg-log{display:none}
body.ui-s #chat-head{height:24px}
body.ui-s #chat-head .ctab{height:21px;padding:0 14px;font-size:.68rem}
body.ui-s #chat-col{height:21px;font-size:.72rem}
body.ui-s #chat-input{font-size:16px;height:30px}
body.ui-s #chat-send{height:32px;font-size:.78rem}
/* 打字中（手機鍵盤開啟）：底欄精簡為 3 行＋輸入列並貼在鍵盤上方，控制鈕暫時隱藏 */
body.ui-s.chat-typing #dock{height:auto !important;bottom:var(--kb,0px)}
body.ui-s.chat-typing #dock-tools,body.ui-s.chat-typing #dock-left,body.ui-s.chat-typing #chat-head{display:none}
body.ui-s.chat-typing #chat-log{flex:none;height:calc(3 * 1.38em + 4px)}
body.ui-s.chat-typing .joy,body.ui-s.chat-typing .atk-btn,body.ui-s.chat-typing .act-btns,body.ui-s.chat-typing #msg-log{visibility:hidden}
/* ===== 快捷欄（1–9、0）＋ 技能視窗拖曳 ===== */
#dock-left #skill-bar,#hud #skill-bar{display:none !important}
#quick-slots{display:grid !important;grid-template-columns:repeat(5,30px);gap:3px}
.hb-slot{width:30px;height:30px;position:relative;padding:0;border:1px solid #6a5840;border-radius:2px;background:linear-gradient(180deg,#221d17,#0e0c0a);box-shadow:inset 0 0 0 1px #000,inset 0 1px 0 rgba(255,230,170,.1);color:#f4ecd8;font-size:1rem;line-height:28px;text-align:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
.hb-slot .k{position:absolute;left:2px;top:0;font-size:.5rem;line-height:1;color:#ffe9a8;text-shadow:0 0 2px #000;z-index:2}
.hb-slot .q{position:absolute;right:1px;bottom:0;font-size:.5rem;line-height:1;color:#fff;text-shadow:0 0 2px #000;z-index:2}
.hb-slot .cdo{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--cd,0) * 360deg),transparent 0);z-index:1;pointer-events:none}
.hb-slot .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:bold .62rem sans-serif;color:#fff;text-shadow:0 0 3px #000;z-index:2}
.hb-slot.empty{opacity:.55}
.hb-slot.zero{filter:grayscale(1) brightness(.6)}
.hb-slot.armed{border-color:#ffd27a;box-shadow:0 0 6px #ffd27a}
.hb-slot.rz{border-color:#7fd4ff;box-shadow:0 0 6px #7fd4ff}
.hb-slot.js{border-color:var(--jc,#8d7350)}
.hb-slot.drop{border-color:#ffe14a;box-shadow:0 0 0 2px #ffe14a,inset 0 0 8px rgba(255,225,74,.5)}
.hb-slot:active{filter:brightness(1.25)}
body.ui-s #quick-slots{grid-template-columns:repeat(6,24px);gap:2px}
body.ui-s .hb-slot{width:24px;height:24px;line-height:22px;font-size:.8rem}
body.ui-s .hb-slot.x{display:none}
body.ui-s #dock.chat-open #quick-slots{grid-template-columns:repeat(10,26px)}
body.ui-s #dock.chat-open .hb-slot{width:26px;height:26px}
body.ui-s #dock.chat-open .hb-slot.x{display:block}
#hb-ghost{position:fixed;z-index:80;width:38px;height:38px;margin:-19px 0 0 -19px;display:none;align-items:center;justify-content:center;font-size:1.3rem;border:2px solid #ffe14a;border-radius:4px;background:rgba(20,16,12,.85);box-shadow:0 4px 14px rgba(0,0,0,.6);pointer-events:none}
#hb-ghost.on{display:flex}
#hb-tip{position:fixed;z-index:79;display:none;max-width:240px;padding:6px 9px;background:rgba(10,8,6,.95);border:1px solid #c9a227;border-radius:3px;color:#f4ecd8;font-size:.72rem;line-height:1.4;pointer-events:none;box-shadow:0 4px 16px #000}
#hb-tip.on{display:block}
#hb-tip b{color:#ffe9a8}
#hb-tip .t2{color:#cdbb98;font-size:.66rem}
#skill-win{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 14px + var(--sab) + var(--chat-over,0px));z-index:30;display:none;width:min(440px,94vw);max-height:min(52vh,420px);flex-direction:column;
  background:linear-gradient(180deg,rgba(40,34,28,.97),rgba(16,13,10,.97));border:1px solid #8d7350;border-top:3px solid #6e5e48;border-radius:3px;box-shadow:inset 0 1px 0 #e4d2a4,0 10px 30px rgba(0,0,0,.6);color:#f4ecd8}
#skill-win.open{display:flex}
#skill-win .sw-head{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #5c5346;background:linear-gradient(180deg,#4d453a,#221d18)}
#skill-win .sw-head b{color:#ffe9a8;white-space:nowrap}
#skill-win .sw-tip{flex:1;font-size:.6rem;color:#bfae8a;line-height:1.25}
.sw-x{border:1px solid #6e5e48;background:#1a1612;color:#ffe9a8;width:26px;height:24px;border-radius:2px;cursor:pointer;flex:none}
#skill-win .sw-body{overflow:auto;padding:6px 8px 8px}
#skill-win .sw-sec{font-size:.64rem;color:#cdbb98;margin:4px 0 4px;border-bottom:1px dashed #4a4034}
.sw-grid{display:flex;flex-wrap:wrap;gap:6px}
.sw-ic{width:44px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sw-ic .b{width:38px;height:38px;position:relative;border:1px solid var(--jc,#8d7350);border-radius:3px;background:linear-gradient(180deg,#2c261f,#100d0a);display:flex;align-items:center;justify-content:center;font-size:1.25rem;overflow:hidden;box-shadow:inset 0 0 0 1px #000}
.sw-ic .b .lv{position:absolute;right:1px;bottom:0;font-size:.5rem;color:#ffe9a8;text-shadow:0 0 2px #000;z-index:2}
.sw-ic .n{font-size:.52rem;color:#e6d6b4;max-width:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-ic.pas{cursor:help}
.sw-ic.pas .b{filter:saturate(.4);border-style:dashed}
.sw-ic.inbar .b::before{content:'✓';position:absolute;left:2px;top:0;font-size:.55rem;color:#9fe09f;z-index:2}
/* 國家面板（預留） */
#nation-overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#nation-overlay.open{display:flex}
.nt-panel{width:min(520px,94vw);max-height:86vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#2e2820,#120f0c);border:2px solid #8d7350;border-top:4px solid #c9a227;border-radius:4px;box-shadow:inset 0 1px 0 #e4d2a4,0 14px 40px rgba(0,0,0,.7);color:#f4ecd8}
.nt-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #5c5346;background:repeating-linear-gradient(90deg,#3a342c 0 1px,#1c1916 1px 11px)}

.nt-body{padding:12px;overflow:auto;min-height:180px}
.nt-sec{display:none}
.nt-sec.on{display:block}
.nt-sec h4{margin:0 0 8px;color:#9fd0ff}
.nt-ph{border:1px dashed #6e5e48;border-radius:3px;padding:26px 12px;text-align:center;color:#bfae8a;background:rgba(0,0,0,.25);line-height:1.6}
.nt-foot{padding:8px 12px;border-top:1px solid #5c5346;text-align:center;color:#ffd27a;font-size:.8rem}
#xdef-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:center;justify-content:center}
#xdef-overlay.open{display:flex}
#xdef-overlay .xdef-panel{width:min(420px,92vw);max-height:88vh;overflow:auto;background:linear-gradient(#2a1e12,#1a120a);border:2px solid #c9a227;border-radius:10px;padding:14px 16px;color:#f0e2c0;font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.6)}

#xdef-overlay .xb i{display:block;height:100%;background:linear-gradient(90deg,#4a90d0,#9fd0ff)}
#xdef-overlay .btn{margin-top:8px;width:100%}

/* —— Buff 列：畫面最上方置中（safe-area）；debuff 紅框；冷卻中灰色 —— */
#hud-buffs{position:fixed !important;top:calc(4px + var(--sat,0px)) !important;left:50% !important;transform:translateX(-50%);z-index:9;margin:0 !important;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-height:62px;overflow:hidden;pointer-events:auto}
#hud-buffs .buff-chip{width:28px;height:28px;font-size:.95rem;background:linear-gradient(180deg,rgba(42,36,28,.9),rgba(16,14,12,.9))}
#hud-buffs .buff-chip.deb{border:2px solid #e03030;box-shadow:0 0 6px rgba(255,40,40,.6),inset 0 0 6px rgba(255,60,60,.35);background:linear-gradient(180deg,rgba(70,16,16,.92),rgba(30,8,8,.92))}
#hud-buffs .buff-chip.deb .bt{color:#ff9a9a}
#hud-buffs .buff-chip.cd{filter:grayscale(.7);opacity:.75}
body.ui-s #hud-buffs{gap:2px;max-height:50px}
body.ui-s #hud-buffs .buff-chip{width:23px;height:23px;font-size:.8rem}
#gain-ctr{position:fixed;left:50%;top:calc(38px + var(--sat,0px));transform:translateX(-50%);z-index:9;pointer-events:none;display:flex;gap:8px;align-items:center;padding:2px 10px;border-radius:12px;background:rgba(16,12,6,.62);border:1px solid rgba(201,162,39,.55);font-weight:900;font-size:.8rem;color:#f5e6c8;text-shadow:0 1px 2px #000;opacity:0;transition:opacity .5s;white-space:nowrap}

#gain-ctr .ge{color:#9fe0ff} #gain-ctr .gg{color:#ffd040} #gain-ctr .gk{color:#ffb080} #gain-ctr small{font-size:.65rem;color:#9cff9c}
body.ui-s #gain-ctr{font-size:.66rem;padding:1px 7px;gap:5px}

  background:linear-gradient(180deg,rgba(40,34,28,.97),rgba(16,13,10,.97));border:1px solid #8d7350;border-top:3px solid #6e5e48;border-radius:3px;box-shadow:inset 0 1px 0 #e4d2a4,0 10px 30px rgba(0,0,0,.6);color:#f4ecd8}
#macro-win.open{display:flex}
#macro-win .sw-head{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #5c5346;background:linear-gradient(180deg,#4d453a,#221d18)}
#macro-win .sw-head b{color:#ffe9a8;white-space:nowrap}
#macro-win .sw-tip{flex:1;font-size:.6rem;color:#bfae8a;line-height:1.25}
#macro-win .sw-body{overflow:auto;padding:6px 8px 8px}
#mc-list .sw-ic.sel .b{border-color:#ffd060;box-shadow:0 0 8px rgba(255,208,96,.7)}

/* —— 自動打怪 開關＋設定 —— */
#auto-ctl{position:fixed;left:calc(8px + var(--sal,0px));top:124px;z-index:26;display:none;gap:3px;pointer-events:auto}
#auto-btn,#auto-gear{border:1px solid #8d7350;background:linear-gradient(180deg,rgba(52,44,34,.94),rgba(20,16,12,.94));color:#ffe9a8;border-radius:4px;font:bold .74rem sans-serif;height:28px;padding:0 9px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#auto-gear{padding:0 6px;font-size:.8rem}
#pot-btn{border:1px solid #8d7350;background:linear-gradient(180deg,rgba(52,44,34,.94),rgba(20,16,12,.94));color:#ffe9a8;border-radius:4px;font:bold .74rem sans-serif;height:28px;padding:0 6px;cursor:pointer;opacity:.75}
#pot-btn.on{opacity:1;background:linear-gradient(180deg,#e07fb0,#8f2f62);color:#fff;border-color:#ffc0e0;box-shadow:0 0 6px rgba(255,120,190,.6)}
#auto-set .ap-st{font-size:.72rem;color:#d8c8a8;padding:4px 0}#auto-set .ap-on{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid #5a4a36;font-weight:bold;color:#ffd0e8}
#auto-set .ap-link{display:block;width:100%;margin:4px 0;padding:4px;border:1px solid #8d7350;border-radius:3px;background:rgba(80,40,60,.6);color:#ffd0e8;font:bold .74rem sans-serif;cursor:pointer}
#auto-btn.on{background:linear-gradient(180deg,#7fe07f,#2f8f2f);color:#0b240b;border-color:#bfffbf;animation:autoGlow 1.3s ease-in-out infinite}
#auto-btn.wait{background:linear-gradient(180deg,#e8b050,#8a5a10);color:#fff4d0;border-color:#ffd890}
@keyframes autoGlow{0%,100%{box-shadow:0 0 4px rgba(120,255,120,.5)}50%{box-shadow:0 0 12px rgba(120,255,120,.95)}}
#dock-bot.on{background:linear-gradient(180deg,#7fe07f,#2f8f2f)!important;color:#0b240b}
#auto-set{position:fixed;z-index:40;display:none;width:250px;max-width:calc(100vw - 16px);background:linear-gradient(180deg,rgba(40,34,28,.98),rgba(16,13,10,.98));border:1px solid #8d7350;border-top:3px solid #6e5e48;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.6);color:#f4ecd8;font-size:.72rem;padding:6px 8px 8px}
#auto-set.open{display:block}
#eqp{position:fixed;z-index:19;display:none;width:262px;padding:4px;background:linear-gradient(180deg,rgba(28,24,20,.95),rgba(10,8,7,.95));border:1px solid #6e5e48;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.7),inset 0 0 0 1px rgba(0,0,0,.6);color:#e8e2d4;font:.66rem sans-serif;pointer-events:auto;user-select:none}
#eqp.open{display:flex;gap:4px}
#eqp .eq-pt{position:relative;flex:0 0 74px;border:1px solid #4a3f33;background:radial-gradient(ellipse at 50% 40%,#3a3a44,#121014 75%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
#eqp .eq-pt canvas{width:74px;height:100%;display:block}
#eqp .eq-pt b{position:absolute;left:2px;right:2px;top:2px;font:bold .6rem sans-serif;color:#ffe9a8;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#eqp .eq-pt button{position:absolute;right:2px;bottom:2px;width:18px;height:18px;padding:0;border:1px solid #6e5e48;background:rgba(0,0,0,.6);color:#ffe9a8;border-radius:2px;font:bold .6rem sans-serif;cursor:pointer}
#eqp .eq-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#eqp .eq-r{display:flex;align-items:center;gap:4px;height:21px;padding:0 3px 0 0;border:1px solid #3a3229;background:rgba(0,0,0,.45);cursor:pointer;white-space:nowrap;overflow:hidden}
#eqp .eq-r:hover{border-color:#8d7350;background:rgba(60,50,38,.6)}
#eqp .eq-r .ic{flex:0 0 19px;height:19px;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:#16120e;border-right:1px solid #3a3229;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
#eqp .eq-r .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#f2ede2;text-shadow:0 1px 1px #000}
#eqp .eq-r .nm small{color:#fff;font-size:.6rem;opacity:.92}
#eqp .eq-r .sf{color:#ffd860;font-weight:bold;font-size:.6rem}
#eqp .eq-r.empty .nm{color:#7d7366}#eqp .eq-r.empty .ic{opacity:.45;filter:grayscale(1)}
#eqp .eq-r.gold .nm{color:#ffd860}
body.ui-s #eqp{width:214px;font-size:.6rem}body.ui-s #eqp .eq-pt{flex-basis:58px}body.ui-s #eqp .eq-pt canvas{width:58px}body.ui-s #eqp .eq-r{height:19px}body.ui-s #eqp .eq-r .ic{flex-basis:17px;height:17px;font-size:.72rem}
/* 自動巨集（裝備欄下方 3 格）*/
#amac{position:fixed;z-index:19;display:none;align-items:stretch;gap:3px;padding:3px;background:linear-gradient(180deg,rgba(28,24,20,.95),rgba(10,8,7,.95));border:1px solid #6e5e48;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.5);box-sizing:border-box}
#amac.show{display:flex}
#amac .am-h{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font:bold .58rem "Microsoft JhengHei",sans-serif;color:#ffe9a8;writing-mode:vertical-rl;letter-spacing:1px;padding:0 1px;text-shadow:0 1px 1px #000}
#amac .am-slot{position:relative;flex:1 1 0;min-width:0;height:30px;display:flex;align-items:center;gap:3px;padding:0 12px 0 5px;border:1px solid #4a3f33;background:rgba(0,0,0,.5);color:#f2ede2;cursor:pointer;font-size:.62rem;user-select:none;-webkit-user-select:none;touch-action:none;box-sizing:border-box}
#amac .am-slot:hover{border-color:#8d7350}
#amac .am-slot .ic{flex:0 0 auto;font-size:.95rem;line-height:1}
#amac .am-slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 1px #000}
#amac .am-slot.empty{color:#8d8172;border-style:dashed}
#amac .am-slot.on{border-color:#ffd860;box-shadow:0 0 6px 1px rgba(255,200,60,.75),inset 0 0 6px rgba(255,200,60,.35);animation:amGlow 1.2s ease-in-out infinite;background:rgba(60,46,14,.6)}
@keyframes amGlow{50%{box-shadow:0 0 12px 3px rgba(255,200,60,.95),inset 0 0 9px rgba(255,200,60,.5)}}
#amac .am-slot:not(.on) .pl{display:none}
#amac .am-slot .pl{position:absolute;left:1px;top:0;color:#7dff7d;font-style:normal;font-size:.5rem;line-height:1;text-shadow:0 0 3px #000}
#amac .am-slot.run .ic{animation:amPulse .45s ease-in-out infinite alternate}
@keyframes amPulse{to{transform:scale(1.25);filter:drop-shadow(0 0 4px #ffd860)}}
#amac .am-slot .gear{position:absolute;right:1px;top:1px;font-size:.55rem;line-height:1;opacity:.8;font-style:normal}
#amac .am-slot .cd{position:absolute;right:2px;bottom:1px;font-size:.48rem;color:#bfae8a;font-style:normal;line-height:1}
#amac .am-slot.drop{border-color:#9cff9c;box-shadow:0 0 6px #9cff9c}
#amac.compact .am-slot{flex:0 0 32px;width:32px;padding:0;justify-content:center}#amac.compact .nm,#amac.compact .cd{display:none}
#amac.compact .am-h{display:none}
#am-pop{position:fixed;z-index:45;display:none;width:236px;padding:6px;background:linear-gradient(180deg,rgba(36,30,24,.98),rgba(14,11,9,.98));border:1px solid #8d7350;border-radius:3px;box-shadow:0 4px 14px rgba(0,0,0,.7);color:#f2ede2;font-size:.66rem}
#am-pop.open{display:block}
#am-pop h4{margin:0 0 4px;font-size:.72rem;color:#ffe9a8;display:flex;justify-content:space-between;align-items:center}
#am-pop h4 button{background:none;border:0;color:#ffe9a8;cursor:pointer;font-size:.8rem}
#am-pop .row{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0 6px}
#am-pop .row button{padding:3px 6px;border:1px solid #5a4c3a;background:rgba(0,0,0,.45);color:#f2ede2;border-radius:2px;cursor:pointer;font-size:.64rem}
#am-pop .row button.sel{border-color:#ffd860;background:rgba(90,70,20,.6);color:#ffe9a8}
#am-pop .t{color:#bfae8a;font-size:.6rem}
#eqp-btn{position:fixed;z-index:19;display:none;align-items:center;gap:3px;height:30px;padding:0 8px;border:1px solid #8d7350;border-radius:15px;background:linear-gradient(180deg,rgba(52,44,34,.94),rgba(20,16,12,.94));color:#ffe9a8;font:bold .74rem sans-serif;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.5)}

#auto-set .as-h{display:flex;align-items:center;gap:6px;margin-bottom:4px}#auto-set .as-h b{flex:1;color:#ffe9a8}
#auto-set label{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dashed #3a3229}
#auto-set select{background:#14110d;color:#ffe9a8;border:1px solid #6e5e48;border-radius:2px;font-size:.72rem;padding:1px 2px}
#auto-set input[type=checkbox]{width:18px;height:18px;accent-color:#50b050}
#auto-set .as-note{color:#bfae8a;font-size:.6rem;margin-top:4px;line-height:1.35}

/* —— 任務自動尋路 —— */
#quest-text .qe{display:flex;align-items:center;gap:4px;cursor:pointer;padding:2px 3px;margin:1px -3px;border-radius:3px;white-space:pre-line}
#quest-text .qe:hover,#quest-text .qe:active{background:rgba(255,224,120,.16)}
#quest-text .qe.go{background:rgba(255,208,96,.22);outline:1px solid rgba(255,208,96,.6)}
#quest-text .qe .qg{flex:none;font-size:.85em;opacity:.85}
#quest-text .qe.nt{cursor:default}
#qpath-ind{position:fixed;left:calc(8px + var(--sal,0px));top:156px;z-index:26;display:none;align-items:center;gap:4px;background:rgba(20,16,12,.92);border:1px solid #ffd060;color:#ffe9a8;border-radius:14px;padding:2px 4px 2px 9px;font:bold .7rem sans-serif;box-shadow:0 0 8px rgba(255,208,96,.45);max-width:min(300px,70vw);pointer-events:auto}
#qpath-ind.on{display:flex}
#qpath-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qpath-x{border:1px solid #8d7350;background:#1a1612;color:#ffe9a8;border-radius:50%;width:22px;height:22px;padding:0;cursor:pointer;flex:none}

/* —— 換角色／登出／離開遊戲 —— */
.menu-exit-sec{margin-top:8px;padding-top:8px;border-top:1px dashed #8d7350;display:flex;flex-direction:column;gap:0}
.mx-btn{font-size:1rem;padding:10px 20px}
.mx-quit{background:linear-gradient(180deg,#a02020,#5a1010)}
#menu-overlay .parchment{max-height:calc(100vh - 16px - var(--sat,0px) - var(--sab,0px));overflow:auto}
body.ui-s #menu-overlay .btn{padding:7px 14px;font-size:.92rem;margin:4px 0}
body.ui-s #menu-overlay .title{font-size:1.3rem !important;margin:2px 0 4px}
@media (max-height:480px){
  #menu-overlay .parchment{padding:10px 22px !important;min-width:min(560px,92vw) !important}
  #menu-overlay .title{font-size:1.15rem !important;margin:0 0 4px !important}
  #menu-overlay .btn{padding:6px 12px !important;font-size:.9rem !important;margin:3px 0 !important}
  .menu-exit-sec{flex-direction:row;gap:6px;margin-top:4px;padding-top:6px}.menu-exit-sec .btn{flex:1;min-width:0}
}
#exit-confirm{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#exit-confirm.open{display:flex}
.xc-box{min-width:min(300px,90vw);max-width:92vw;text-align:center;padding:16px 18px}
.xc-box h2{margin:0 0 6px;color:#ffe9a8;font-size:1.25rem}
.xc-box p{margin:0 0 12px;font-size:.9rem;line-height:1.5;white-space:pre-line}
.xc-btns{display:flex;gap:10px;justify-content:center}.xc-btns .btn{padding:8px 22px;font-size:1rem;margin:0}
#xc-busy{display:none;margin-top:8px;color:#ffe9a8;font-size:.85rem}#exit-confirm.busy #xc-busy{display:block}#exit-confirm.busy .xc-btns{opacity:.5;pointer-events:none}
#bye-screen{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a1d10,#070504)}
#bye-screen.open{display:flex}
.bye-box{text-align:center;padding:22px 26px;max-width:92vw}.bye-ic{font-size:3rem}
#bye-text{font-size:.95rem;line-height:1.6;margin:6px 0 14px;white-space:pre-line}
/* ===== 商店／交易平台／玩家交易（暗色石紋） ===== */
.ws-ov{position:fixed;inset:0;z-index:42;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:calc(6px + var(--sat,0px)) calc(6px + var(--sar,0px)) calc(6px + var(--sab,0px)) calc(6px + var(--sal,0px))}
.ws-ov.open{display:flex}
.ws-panel{width:min(560px,96vw);max-height:min(92vh,640px);display:flex;flex-direction:column;background:linear-gradient(180deg,#2e2820,#120f0c);border:2px solid #8d7350;border-top:4px solid #c9a227;border-radius:4px;box-shadow:inset 0 1px 0 #e4d2a4,0 14px 40px rgba(0,0,0,.7);color:#f4ecd8;font-family:"Microsoft JhengHei",sans-serif;position:relative}
.ws-head{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #5c5346;background:repeating-linear-gradient(90deg,#3a342c 0 1px,#1c1916 1px 11px)}
.ws-head .ws-ic{font-size:1.6rem;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:radial-gradient(#4a3c28,#1a140e);border:1px solid #8d7350;border-radius:4px}
.ws-head .ws-t{flex:1;min-width:0}.ws-head .ws-t b{display:block;color:#ffe9a8;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-head .ws-t small{color:#bfae8a;font-size:.68rem}
.ws-gold{color:#ffd860;font-weight:bold;font-size:.85rem;white-space:nowrap;background:#1a140e;border:1px solid #6a5840;border-radius:3px;padding:3px 7px}
.ws-x{width:34px;height:34px;border:1px solid #6a5840;background:#2a221a;color:#f0dca0;border-radius:4px;font-size:1rem;cursor:pointer;flex:none}
.ws-tabs{display:flex;gap:3px;padding:6px 8px 0;border-bottom:1px solid #8d7350;overflow-x:auto;scrollbar-width:none}
.ws-tabs button{flex:1 0 auto;min-width:56px;height:32px;padding:0 8px;border:1px solid #5c5346;border-bottom:none;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#2e2822,#16120e);color:#c8b690;font:bold .74rem "Microsoft JhengHei",sans-serif;cursor:pointer;position:relative}
.ws-tabs button.on{background:linear-gradient(180deg,#76623e,#3a2f20);color:#ffe9a8;border-color:#c9a227}
.ws-tabs .bdg{position:absolute;top:-4px;right:-2px;background:#c02020;color:#fff;border-radius:8px;font-size:.6rem;padding:0 5px;line-height:15px}
.ws-body{flex:1;min-height:120px;overflow:auto;padding:6px 8px}
.ws-row{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 6px;margin-bottom:4px;background:linear-gradient(180deg,#26201a,#18130f);border:1px solid #4a3e30;border-radius:3px;cursor:pointer;user-select:none}
.ws-row:hover{border-color:#8d7350}.ws-row.sel{border-color:#ffd860;box-shadow:0 0 0 1px #ffd86055 inset;background:linear-gradient(180deg,#3a3020,#1e1810)}
.ws-row.dim{opacity:.55}
.ws-row .ri{font-size:1.35rem;width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:#120e0a;border:1px solid #5c5346;border-radius:3px;position:relative}
.ws-row .ri i{position:absolute;right:1px;bottom:-1px;font-style:normal;font-size:.6rem;color:#fff;text-shadow:0 0 2px #000}
.ws-row .rn{flex:1;min-width:0;line-height:1.2}.ws-row .rn b{display:block;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-row .rn small{display:block;font-size:.64rem;color:#bfae8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-row .rp{color:#ffd860;font-weight:bold;font-size:.8rem;white-space:nowrap;text-align:right}
.ws-row .rp small{display:block;color:#a89878;font-weight:normal;font-size:.6rem}
.ws-btn{height:34px;min-width:44px;padding:0 10px;border:1px solid #8d7350;border-radius:3px;background:linear-gradient(180deg,#5a4a30,#2a2016);color:#ffe9a8;font:bold .76rem "Microsoft JhengHei",sans-serif;cursor:pointer;white-space:nowrap}
.ws-btn.go{background:linear-gradient(180deg,#3f7a3a,#1d3a1a);border-color:#7ac070;color:#e8ffd8}
.ws-btn.red{background:linear-gradient(180deg,#7a3030,#3a1414);border-color:#c07070;color:#ffe0e0}
.ws-btn:disabled{opacity:.45;cursor:default}
.ws-foot{border-top:1px solid #5c5346;padding:6px 8px;background:#16120e;display:flex;flex-direction:column;gap:6px}
.ws-det{font-size:.7rem;line-height:1.35;color:#e8dcc0;max-height:118px;overflow:auto}
.ws-det .up{color:#7cff7c}.ws-det .dn{color:#ff7c7c}.ws-det .warn{color:#ffb060}.ws-det .ok{color:#9cd8ff}
.ws-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ws-qty{display:flex;align-items:center;gap:2px}
.ws-qty button{width:34px;height:34px;border:1px solid #6a5840;background:#2a221a;color:#ffe9a8;border-radius:3px;font-size:1rem;cursor:pointer}
.ws-qty input{width:52px;height:32px;text-align:center;background:#0e0b08;color:#ffe9a8;border:1px solid #6a5840;border-radius:3px;font-size:.85rem}
.ws-fl{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid #3a3228;background:#1a1511}
.ws-fl input,.ws-fl select{height:32px;background:#0e0b08;color:#f0e0c0;border:1px solid #6a5840;border-radius:3px;font-size:.74rem;padding:0 5px;min-width:0}
.ws-fl input[type=search]{flex:1 1 120px}.ws-fl select{flex:0 1 auto}.ws-fl input.num{width:76px}
.ws-empty{color:#a89878;text-align:center;padding:26px 8px;font-size:.8rem}
.ws-note{font-size:.66rem;color:#bfae8a}
#shop-tip{position:fixed;z-index:60;pointer-events:none;display:none;max-width:280px;background:rgba(14,11,8,.96);border:1px solid #c9a227;border-radius:4px;padding:6px 8px;font-size:.7rem;line-height:1.35;color:#f0e4c8;box-shadow:0 6px 18px rgba(0,0,0,.6)}
#shop-tip .up{color:#7cff7c}#shop-tip .dn{color:#ff7c7c}#shop-tip .warn{color:#ffb060}#shop-tip .ok{color:#9cd8ff}
.ws-cf{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:5}
.ws-cf>div{width:min(340px,90%);background:linear-gradient(180deg,#3a3026,#1a140e);border:2px solid #c9a227;border-radius:4px;padding:12px;font-size:.8rem;line-height:1.45}
.ws-cf .ws-act{justify-content:flex-end;margin-top:10px}
.inv-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px}
.inv-pick div{aspect-ratio:1;background:#120e0a;border:1px solid #5c5346;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;position:relative;cursor:pointer}
.inv-pick div.sel{border-color:#ffd860;background:#2e2414}.inv-pick div.off{opacity:.35}
.inv-pick i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:.62rem;color:#fff;text-shadow:0 0 2px #000}
/* 玩家交易 */
.tr-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tr-side{border:1px solid #5c5346;border-radius:3px;padding:6px;background:#17130f}
.tr-side.lock{border-color:#c9a227;box-shadow:0 0 0 1px #c9a22766 inset}.tr-side.conf{border-color:#7ac070;box-shadow:0 0 0 1px #7ac07088 inset}
.tr-side h5{margin:0 0 4px;font-size:.76rem;color:#ffe9a8;display:flex;justify-content:space-between;gap:4px}
.tr-side h5 span{font-weight:normal;color:#bfae8a;font-size:.68rem;white-space:nowrap}
.tr-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.tr-slots div{aspect-ratio:1;background:#0e0b08;border:1px solid #4a3e30;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;position:relative;cursor:pointer}
.tr-slots i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:.6rem;color:#fff;text-shadow:0 0 2px #000}

<script>
// 精準 UI 調整
(function(){
  function fixUI(){
    // 等級顯示
    const nameEl = document.getElementById('hud-name');
    if(nameEl && typeof game !== 'undefined' && game && game.player){
      const lv = game.player.level|0;
      nameEl.textContent = nameEl.textContent.replace(/ · Lv\.\d+/, '') + ' · Lv.' + lv;
    }
    // 熟練度
    let prof = document.getElementById('prof-bar');
    if(!prof){
      prof = document.createElement('div');
      prof.id = 'prof-bar';
      prof.style.cssText = 'position:fixed;top:52px;left:8px;background:rgba(0,0,0,.75);color:#ffd700;padding:2px 8px;border-radius:3px;font-size:11px;z-index:100;';
      document.body.appendChild(prof);
    }
    if(typeof game !== 'undefined' && game && game.player){
      const p = game.player, lv = p.level|0;
      let pct = 0;
      if(lv >= 75){
        pct = Math.min(100, Math.floor(((p.post75Exp||0)/1e8)*100));
      } else {
        const need = Math.floor(100*Math.pow(Math.max(1,lv),1.8)+50*Math.pow(1.06,lv));
        pct = Math.min(100, Math.floor(((p.exp||0)/Math.max(1,need))*100));
      }
      prof.textContent = '熟練 ' + pct + '%';
    }
  }
  setInterval(fixUI, 1000);

  // 包包分頁
  window.invPage = 0;
  function addInvPager(){
    if(document.getElementById('inv-page-btns')) return;
    const panel = document.querySelector('.inv-panel');
    if(!panel) return;
    const pager = document.createElement('div');
    pager.id = 'inv-page-btns';
    pager.style.cssText = 'display:flex;justify-content:center;gap:8px;margin:8px 0;';
    for(let i=0;i<3;i++){
      const b = document.createElement('button');
      b.textContent = '第'+(i+1)+'頁';
      b.className = 'btn';
      b.style.fontSize = '0.75rem';
      b.onclick = ()=>{ window.invPage=i; };
      pager.appendChild(b);
    }
    const grid = panel.querySelector('.inv-grid');
    if(grid) grid.parentNode.insertBefore(pager, grid);
  }
  setInterval(addInvPager, 2000);
})();

// ===== 包包 3頁×50格 + 點擊看裝備 =====
(function(){
  const PAGE_SIZE = 50;
  const PAGES = 3;
  window.invPage = window.invPage || 0;

  function setupInv(){
    if(typeof game === 'undefined' || !game || !game.player) return;
    const p = game.player;
    if(!p.inv) p.inv = [];
    while(p.inv.length < PAGE_SIZE * PAGES) p.inv.push(null);

    

  const grid=document.getElementById('inv-grid');
  grid.innerHTML='';
  const bon=equipBonus(p);
  document.getElementById('inv-info').textContent=`裝備合計 攻+${bon.atk} 防+${bon.def} HP+${bon.hp} MP+${bon.mp} · 外觀≠附加能力`;
  const PAGE=35;
  for(let i=0;i<PAGE;i++){
    const slot=document.createElement('div');
    slot.className='inv-slot';
    const item=p.inv[i];
    if(item&&ITEMS[item.id]){
      const def=ITEMS[item.id];
      const isGear=!!def.slot;
      if(isGear){ slot.classList.add('gear'); slot.classList.add('rar'+itemRarity(item.id)); }
      slot.innerHTML=`<span class="ic">${def.icon}</span>`+
        (isGear?'<span class="eq-tag">裝</span>':'')+
        `<span class="qty">${item.qty}</span>`;
      if(isMobile) slot.title=(isGear?itemTooltip(def):def.name)+(isGear?'\n（點擊裝備）':''); else invTip(slot,def,(isGear?'（點擊裝備）':(def.use?'（點擊使用）':''))+'\n右鍵／🗑️：刪除',item.qty);
      { const iid=item.id; const x=document.createElement('button'); x.type='button'; x.className='del-x'; x.title='刪除'; x.textContent='🗑️'; x.onclick=e=>{ e.stopPropagation(); delOpen(iid); }; slot.appendChild(x);
        slot.oncontextmenu=e=>{ e.preventDefault(); delOpen(iid); }; lpBind(slot,()=>delOpen(iid));
        slot.draggable=!isMobile; slot.ondragstart=e=>{ try{ e.dataTransfer.setData('text/wzw-item',iid); e.dataTransfer.effectAllowed='move'; }catch(_){} };
        slot.addEventListener('click',e=>{ if(DEL.mode){ e.stopImmediatePropagation(); e.preventDefault(); delOpen(iid); } },true); }
      slot.onclick=()=>{
        const info=isGear?itemTooltip(def):(def.name+'：'+def.desc);
        document.getElementById('inv-info').textContent=info;
        if(!tradeBlocks(def)&&def.use(p)){
          item.qty--;
          if(item.qty<=0) p.inv.splice(i,1);
          openInv(); updateHUD(); document.getElementById('inv-info').textContent=info; if(ONLINE&&net) net.saveSoon=true;
        }
      };
    }
    grid.appendChild(slot);

  const sig=JSON.stringify([A,p.macros.map(m=>m.icon+m.name+m.steps.length)]);
  if(sig===AMR.sig&&el.firstChild){ el.querySelectorAll('.am-slot').forEach(s=>{ const i=+s.dataset.a; s.classList.toggle('on',!!AMR.on[i]); s.classList.toggle('run',AMR.cur===i); }); return; } AMR.sig=sig;

function amBind(s,i){ let tm=0, long=false, x0=0, y0=0;

    const p=game.player, A=amEnsure(p); if(e.target.closest('[data-g]')||!p.macros[A[i].m]){ amPop(AMR.pop===i?null:i); return; } amPop(null); amSet(i,!AMR.on[i]); });

  if(!isMobile) bindTip&&bindTip(s,()=>{ const p=game.player, a=amEnsure(p)[i], M=p.macros[a.m]; return M?`<b>${M.icon} ${ESC(M.name)}</b><div class="inv-tip-d">${M.steps.map(st=>(macroStepInfo(p,st)||{}).icon||'?').join(' → ')}<br>點一下：${AMR.on[i]?'停止':'開始'}自動循環施放<br>⚙／右鍵：設定（間隔・條件・更換）</div>`:'<b>自動巨集（空）</b><div class="inv-tip-d">從巨集欄（M／🔗）拖入巨集，或點一下選擇</div>'; }); }
function amPop(i){ const P=document.getElementById('am-pop'); if(!P) return; if(i==null){ P.classList.remove('open'); AMR.pop=null; return; }
  const p=game.player, A=amEnsure(p), a=A[i]; AMR.pop=i;

  P.innerHTML=`<h4>🔁 自動巨集 ${i+1}<button type="button" data-x>✕</button></h4>
    <div class="t">選擇巨集</div><div class="row">${ms}${a.m>=0?'<button type="button" data-m="-1">🗑 清除</button>':''}</div>
    <div class="t">每輪之間的間隔</div><div class="row">${AM_IV.map(v=>`<button type="button" data-iv="${v}" class="${a.iv===v?'sel':''}">${v}s</button>`).join('')}</div>

    <div class="row">${a.m>=0?`<button type="button" data-run class="${AMR.on[i]?'sel':''}">${AMR.on[i]?'⏹ 停止':'▶ 開始自動'}</button>`:''}<button type="button" data-mw>🔗 編輯巨集（M）</button></div>
    <div class="t">冷卻中／MP 不足的步驟會跳過；倒下、進城、回程術或長時間沒有目標會自動停止。</div>`;
  P.onpointerdown=e=>e.stopPropagation();
  P.querySelector('[data-x]').onclick=()=>amPop(null);
  P.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ amPick(i,+b.dataset.m); amPop(i); });
  P.querySelectorAll('[data-iv]').forEach(b=>b.onclick=()=>{ a.iv=+b.dataset.iv; saveGame(true); amRender(true); amPop(i); });
  P.querySelectorAll('[data-cb]').forEach(b=>b.onclick=()=>{ a.cb=+b.dataset.cb; saveGame(true); amRender(true); amPop(i); });
  const run=P.querySelector('[data-run]'); if(run) run.onclick=()=>{ amSet(i,!AMR.on[i]); amPop(i); };
  P.querySelector('[data-mw]').onclick=()=>{ amPop(null); toggleMacroWin(true); };
  P.classList.add('open'); const S=document.querySelector(`#amac .am-slot[data-a="${i}"]`)||document.getElementById('amac'), r=S.getBoundingClientRect(), pr=P.getBoundingClientRect();
  let x=Math.max(4,Math.min(innerWidth-pr.width-4,r.left)), y=r.top-pr.height-6; if(y<4) y=Math.min(innerHeight-pr.height-4,r.bottom+6); P.style.left=x+'px'; P.style.top=y+'px'; }
try{ document.addEventListener('pointerdown',e=>{ const P=document.getElementById('am-pop'); if(P&&P.classList.contains('open')&&!P.contains(e.target)&&!e.target.closest('#amac')) amPop(null); },true); }catch(e){}

/** 轉職選單：列出 3 個子職業與說明 */
function openJobChoice(npc){
  const p=game.player;
  const kids=canPromote(p);
  if(!kids||!kids.length){ openMasterHub(npc); return; }
  const tier=jobTierOf(p), label=JOB_TIER_LABEL[tier+1];
  paused=true;
  document.getElementById('dialog-name').textContent=`${npc.emoji} ${npc.name} · ${label}`;
  const opts=document.getElementById('dialog-opts'); opts.innerHTML='';
  document.getElementById('dialog-text').textContent=`「${jobTitle(p)}」可${label}為以下 3 種職業之一（選定後無法更改）：`;
  for(const k of kids){
    const j=JOBS[k];
    const skill=JOB_SKILL_TABLE.find(x=>x.job===k);
    const row=document.createElement('div');
    row.style.cssText='display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid rgba(201,162,39,.45);border-radius:6px;margin:4px 0;text-align:left';
    const sub=j.tier<3?`<br><small>${JOB_TIER_LABEL[j.tier+1]}分支：${jobChildren(k).map(c=>JOBS[c].name).join('／')}</small>`:'';
    const sk=(skill?`<br><small>新技能：${skill.icon} ${skill.name}（${j.tier>=3?'V':'Q'}）— ${jobSkillDesc(skill,1)}</small>`:'')+(j.trait?`<br><small>✦ 特性：${j.trait}</small>`:'');
    const met=jobAttrMet(p,k);
    row.innerHTML=`<div><b>${j.icon} ${j.name}</b>　<small>${jobBonusText(j.bonus)}</small><br><small>${j.desc}</small>${sk}${sub}<br><small>屬性需求：${jobAttrNeedHTML(p,k)}</small></div>`;
    const b=document.createElement('button'); b.className='btn secondary'; b.textContent=met?`選擇「${j.name}」`:`屬性不足，無法選擇「${j.name}」`;
    if(!met){ b.disabled=true; b.style.opacity='.5'; }
    b.onclick=()=>{
      if(!jobAttrMet(p,k)){ msg('屬性未達轉職需求'); return; }
      if(!confirm(`確定${label}為「${j.name}」嗎？選定後無法更改。`)) return;
      if(doPromote(p,k)){
        document.getElementById('dialog-text').textContent=`恭喜！從此刻起，你就是「${jobTitle(p)}」了！`;
        opts.innerHTML='';
        const ok=document.createElement('button'); ok.className='btn secondary'; ok.textContent='感謝指導！'; ok.onclick=()=>openMasterHub(npc); opts.appendChild(ok);
      }
    };
    row.appendChild(b); opts.appendChild(row);
  }
  const back=document.createElement('button'); back.className='btn secondary'; back.textContent='返回'; back.onclick=()=>openMasterHub(npc); opts.appendChild(back);
  document.getElementById('dialog-overlay').classList.add('open');
}
let scareView='lv';
function openScarecrowPanel(sc, view){
  const p=game.player; ensureSkills(p); ensureAttr(p);
  if(view) scareView=view;
  atScarecrow=sc; paused=true;
  const isNation=scarecrowType(sc)==='nation';
  const blockWhy=scarecrowBlockReason(p,sc);
  document.getElementById('dialog-name').textContent=(isNation?'👑 ':'🌾 ')+scarecrowTitle(sc);
  const opts=document.getElementById('dialog-opts'); opts.innerHTML='';
  document.getElementById('dialog-text').textContent=`EXP 池：${p.exp}\n等級直接扣池；技能與六屬性各自吸收經驗，條滿後手動升一級（溢出作廢，不會隨等級自動增加）。`
    +(isNation?'\n國家稻草人：任何轉職階段皆可使用。':'\n村莊稻草人：初職～二轉可使用；三轉以上請至王都 亞斯藍或霜燼要塞。')
    +(blockWhy?`\n⛔ ${blockWhy}`:'');
  const tabs=document.createElement('div'); tabs.className='scare-tabs';
  for(const [id,lab] of [['lv','等級'],['sk','技能'],['at','屬性']]){
    const b=document.createElement('button');
    b.className='btn secondary'+(scareView===id?' on':'');
    b.textContent=lab;
    b.onclick=()=>{ scareView=id; openScarecrowPanel(sc); };
    tabs.appendChild(b);
  }
  opts.appendChild(tabs);
  function addOpt(label,fn,disabled){
    const b=document.createElement('button');
    b.className='btn secondary'; b.textContent=label;
    if(disabled){b.disabled=true;b.style.opacity='.5'}
    b.onclick=fn; opts.appendChild(b); return b;
  }
  if(scareView==='lv'){
    if(blockWhy) addOpt(`⛔ 升級角色 Lv.${p.level}→${p.level+1}（${blockWhy}）`,()=>msg(blockWhy),true);
    else addOpt(`升級角色 Lv.${p.level}→${p.level+1}（需 ${p.expNext} EXP）`,()=>{ if(tryLevelUp(p)) openScarecrowPanel(sc); }, p.exp<p.expNext);
  } else if(scareView==='at'){
    const note=document.createElement('div');
    note.style.cssText='font-size:12px;color:#cbb892;margin:2px 0 6px;line-height:1.45';
    note.textContent='力量→物理攻擊　敏捷→命中／閃避／移速　智力→魔法攻擊／MP　體力→HP　精神→治療／減傷／MP　幸運→暴擊。點一下只升 1 點。';
    opts.appendChild(note);
    for(const key of ATTR_KEYS){
      const cur=p.attr[key]|0, need=attrExpNeed(cur), have=Math.floor(+p.attrExp[key]||0);
      const room=Math.max(0,need-have), maxed=need<=0;
      const row=document.createElement('div');
      row.style.cssText='display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid rgba(201,162,39,.35);border-radius:6px;margin:4px 0';
      const pct=need>0?Math.min(100,have/need*100):100;
      row.innerHTML=`<div>${ATTR_NAME[key]} <b>${cur}</b>${maxed?'（已達上限）':` · 經驗 ${have}/${need}`}</div><div style="height:8px;background:#222;border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#c9a227"></div></div>`;
      const btns=document.createElement('div'); btns.style.cssText='display:flex;gap:4px;flex-wrap:wrap';
      const mk=(label,fn,dis)=>{ const b=document.createElement('button'); b.className='btn secondary'; b.textContent=label; if(dis){b.disabled=true;b.style.opacity='.5'} b.onclick=fn; btns.appendChild(b); };
      if(blockWhy) mk(blockWhy,()=>msg(blockWhy),true);
      else if(!maxed){
        for(const a of [10,50,'fill']) mk(a==='fill'?'吸收經驗 填滿':`吸收經驗 +${a}`,()=>{ if(absorbAttrExp(p,key,a)) openScarecrowPanel(sc); }, room<=0||p.exp<=0);
        mk(`提升 ${cur}→${cur+1}`,()=>{ if(tryRaiseAttr(p,key)) openScarecrowPanel(sc); }, have<need);
      }
      row.appendChild(btns); opts.appendChild(row);
    }
  } else {
    for(const def of SKILL_DEFS){
      if(def.free) continue;
      const lv=p.skills[def.id]|0;
      if(lv>=def.maxLv){ const b=addOpt(`${def.icon} 技能 ${def.name} Lv.${lv}（已滿級）`,()=>{},true); const tg=rzTagHTML(p,def.id); if(tg){ b.insertAdjacentHTML('beforeend',' '+tg); b.title=rzTagTip(p,def.id); } continue; }
      if(!skillAvailable(p,def)) continue;
      if(def.job&&lv<=0){ addOpt(`👼 ${def.icon} ${def.name}：職業技能請到天使雕像學習`,()=>msg('職業技能在天使雕像學習；學會後可在稻草人升級'),true); continue; }
      if(blockWhy){ addOpt(`⛔ ${def.icon} 技能 ${def.name} Lv.${lv}（${blockWhy}）`,()=>msg(blockWhy),true); continue; }
      const need=skillCost(def,lv), cur=Math.floor(+p.skillExp[def.id]||0), room=Math.max(0,need-cur);
      const row=document.createElement('div');
      row.style.cssText='display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid rgba(201,162,39,.35);border-radius:6px;margin:4px 0';
      const pct=need>0?Math.min(100,cur/need*100):0;
      row.innerHTML=`<div>${def.icon} ${def.name}${rzTagHTML(p,def.id)} Lv.${lv} · 經驗 ${cur}/${need}${def.job?`<br><small>${def.desc}｜${def.effectDesc(lv)}</small>`:''}</div><div style="height:8px;background:#222;border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#c9a227"></div></div>`;
      const btns=document.createElement('div'); btns.style.cssText='display:flex;gap:4px;flex-wrap:wrap';
      const mk=(label,fn,dis)=>{ const b=document.createElement('button'); b.className='btn secondary'; b.textContent=label; if(dis){b.disabled=true;b.style.opacity='.5'} b.onclick=fn; btns.appendChild(b); };
      for(const a of [10,50,'fill']){
        mk(a==='fill'?'吸收經驗 填滿':`吸收經驗 +${a}`,()=>{ if(absorbSkillExp(p,def.id,a)) openScarecrowPanel(sc); }, room<=0||p.exp<=0);
      }
      mk(`升級 Lv.${lv}→${lv+1}`,()=>{ if(tryUnlockOrUpgradeSkill(p,def.id)) openScarecrowPanel(sc); }, cur<need);
      row.appendChild(btns); opts.appendChild(row);
    }
  }
  addOpt('離開',closeDialog);
  document.getElementById('dialog-overlay').classList.add('open');
}
function openMasterSkills(npc){
  const p=game.player;
  ensureSkills(p);
  paused=true;
  document.getElementById('dialog-name').textContent=npc.emoji+' '+npc.name+' · 技能';
  const opts=document.getElementById('dialog-opts');
  opts.innerHTML='';
  let text=`EXP 池：${p.exp}\n選擇要學習或強化的技能（消耗 EXP）：`;
  document.getElementById('dialog-text').textContent=text;

  function addOpt(label,fn,disabled){
    const b=document.createElement('button');
    b.className='btn secondary'; b.textContent=label;
    if(disabled){b.disabled=true;b.style.opacity='.5'}
    b.onclick=fn; opts.appendChild(b);
  }

  for(const def of SKILL_DEFS){
    if(!skillAvailable(p,def)||def.free) continue;
    const lv=p.skills[def.id]|0;
    const maxed=lv>=def.maxLv;
    const cost=maxed?0:skillCost(def,lv);
    const label=maxed
      ? `${def.icon} ${def.name} Lv.${lv}（已滿級）· ${def.effectDesc(lv)}`
      : (lv===0
        ? `${def.icon} 學習「${def.name}」（-${cost} EXP）· ${def.desc}`
        : `${def.icon} 強化「${def.name}」Lv.${lv}→${lv+1}（-${cost} EXP）· ${def.effectDesc(lv)}`);
    addOpt(label,()=>{
      if(tryUnlockOrUpgradeSkill(p,def.id)) openMasterSkills(npc);
    }, maxed || (Math.floor(+p.skillExp[def.id]||0))<cost);
  }
  addOpt('返回',()=>openMasterHub(npc));
  document.getElementById('dialog-overlay').classList.add('open');
}
function openDialog(npc){
  paused=true;
  if(game&&game.player&&npc){ npc.tx=null; npc.wt=2000; npc.face=game.player.x>=npc.x?1:-1; }
  document.getElementById('dialog-name').textContent=npc.emoji+' '+npc.name;
  const opts=document.getElementById('dialog-opts');
  opts.innerHTML='';
  const p=game.player;
  let text='';

  if(npc.id==='master'){
    ensureSkills(p);
    if(!p.tutorialDone){
      if(masterTutStep===0){
        text=npc.lines.welcome;
        addOpt('我準備好了',()=>{masterTutStep=1;openDialog(npc)});
      } else if(masterTutStep===1){
        text=npc.lines.controls;
        addOpt('繼續',()=>{masterTutStep=2;openDialog(npc)});
      } else {
        text=npc.lines.handoff;
        addOpt('去找長者！',()=>{
          p.tutorialDone=true;
          masterTutStep=0;
          msg('📜 教學完成！去找長者歐巴桑接任務！');
          closeDialog(); updateQuestUI();
        });
      }
    } else {
      masterTutStep=0;
      openMasterHub(npc);
      return;
    }
  } else if(npc.id==='elder'){
    if(!p.tutorialDone){
      text='咳咳……先去找「冒險主」報到吧！他就在你出生點附近。本長者不收沒報到的新人！';
      addOpt('好的',closeDialog);
    } else if(p.quest.status==='inactive'){
      text=npc.lines.default;
      addOpt('接受任務「討伐魔物」',()=>{
        p.quest.status='active'; p.quest.kills=0;
        msg('📜 任務開始：打倒 5 隻魔物！');
        closeDialog(); updateQuestUI();
      });
      addOpt('我再逛逛…',closeDialog);
    } else if(p.quest.status==='active'){
      text=npc.lines.progress(p.quest.kills);
      if(p.quest.herbs>=3){
        addOpt('交出奇妙香草 (3株)',()=>{
          // remove herbs
          let need=3;
          for(let i=p.inv.length-1;i>=0&&need>0;i--){
            if(p.inv[i].id==='herb'){
              const take=Math.min(need,p.inv[i].qty);
              p.inv[i].qty-=take; need-=take;
              if(p.inv[i].qty<=0)p.inv.splice(i,1);
            }
          }
          p.quest.status='ready';
          completeQuest();
          closeDialog();
        });
      }
      addOpt('好的，我繼續打！',closeDialog);
    } else if(p.quest.status==='ready'){
      text=npc.lines.done;
      addOpt('領取獎勵',()=>{completeQuest();closeDialog()});
    } else {
      text=npc.lines.after;
      addOpt('告辭',closeDialog);
    }
  } else if(npc.role==='vendor'||((npc.id==='merchant'||npc.role==='shop')&&npc.shop)){
    openShop(npc); return;

async function shopSell(L){

function tryTalk(){
  if(!game||paused)return;
  const p=game.player;
  { let best=null, bd=1e9; for(const npc of NPCS){ const d=dist(p,npc)-(npc.role==='angel'?40:npc.role==='vendor'?50:0); if(d<50&&d<bd){ bd=d; best=npc; } } if(best){ openDialog(best); return; } }

  }
  {const sc=nearestScarecrow(p,56); if(sc){openScarecrowPanel(sc);return}}

        ctx.globalAlpha=out?0.7:1; ctx.fillStyle=alive?'rgba(120,0,0,.9)':'rgba(40,40,40,.85)'; ctx.strokeStyle=alive?'#ffd700':'#888'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(mx,my,7*mk,0,Math.PI*2); ctx.fill(); ctx.stroke();

// ========== RENDER ==========
const TILE_COLORS={
  grass:['#1c3018','#24381c'],
  path:['#4e4a42','#5a564c'],
  stone:['#3e4046','#4a4c52'],
  tree:['#163016','#1e3a1c'],
  rock:['#3a3a38','#484844'],
  flower:['#1e341a','#26401e'],
  water:['#1a3048','#243e58'],
  cave:['#3a322b','#433a32'],
  cwall:['#3e342c','#383029']
};

function draw(){
  const vw=window.innerWidth, vh=window.innerHeight;
  ctx.clearRect(0,0,vw,vh);
  if(!game)return;
  const p=game.player;
  // 攝影機鎖定：讓 drawPlayer 的 humanoid 錨點永遠在螢幕正中 (vw/2,vh/2)
  // （drawPlayer 使用 sy=s.y-8，故 Y 多扣 8；zoom 繞中心縮放，故不除以 CAM_ZOOM）
  const piv=worldToIso(p.x,p.y);
  const PLAYER_DRAW_Y=8; // 須與 drawPlayer 的 sy=s.y-8 一致
  camera.x=piv.x-vw/2;
  camera.y=piv.y-PLAYER_DRAW_Y-vh/2;
  ctx.save();
  ctx.translate(vw/2, vh/2);
  ctx.scale(CAM_ZOOM, CAM_ZOOM);
  ctx.translate(-vw/2, -vh/2);
  const ptx=Math.floor(p.x/TILE), pty=Math.floor(p.y/TILE);

  // 由螢幕四角反推可見磚範圍，再以 VIEW_RADIUS 裁切遠距
  const corners=[[0,0],[vw,0],[0,vh],[vw,vh],[vw/2,0],[vw/2,vh],[0,vh/2],[vw,vh/2]];
  let minTX=Infinity,maxTX=-Infinity,minTY=Infinity,maxTY=-Infinity;
  for(const [sx,sy] of corners){
    const w=screenToWorld(sx,sy);
    const tx=Math.floor(w.x/TILE), ty=Math.floor(w.y/TILE);
    if(tx<minTX)minTX=tx; if(tx>maxTX)maxTX=tx;
    if(ty<minTY)minTY=ty; if(ty>maxTY)maxTY=ty;
  }
  minTX-=1; maxTX+=1; minTY-=1; maxTY+=1;
  minTX=Math.max(minTX, ptx-VIEW_RADIUS);
  maxTX=Math.min(maxTX, ptx+VIEW_RADIUS);
  minTY=Math.max(minTY, pty-VIEW_RADIUS);
  maxTY=Math.min(maxTY, pty+VIEW_RADIUS);

  // Ground diamonds (back-to-front by tx+ty)；圓形裁切遠磚
  const ground=[];
  const viewR2=(VIEW_RADIUS+0.35)*(VIEW_RADIUS+0.35);
  for(let ty=minTY;ty<=maxTY;ty++){
    for(let tx=minTX;tx<=maxTX;tx++){
      const dx=tx-ptx, dy=ty-pty;
      if(dx*dx+dy*dy>viewR2) continue;
      ground.push([tx,ty]);
    }
  }
  ground.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));

  for(const [tx,ty] of ground){
    const type=tileAt(tx*TILE+1,ty*TILE+1);
    const cols=tileColorsFor(type);
    const checker=(tx+ty)&1;
    const top=cols[checker];
    const center=worldToScreen(tx*TILE+TILE/2, ty*TILE+TILE/2);
    // slightly thicker water / stone
    if(curCont!=='scambray' && drawContTile(type,tx,ty,center,cols,top,performance.now())){}
    else if(type==='cwall'){ const hv=hash2(tx,ty,31), hh=30+(hv%14); const th=CAVE_THEME[curCont]||CAVE_THEME.scambray; drawIsoBlock(ctx,center.x,center.y,ISO_TW,ISO_TH,hh,checker?th.wt:th.wt2,th.wl,th.wr);
      ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(center.x-ISO_TW*0.3,center.y-hh*0.55); ctx.lineTo(center.x-ISO_TW*0.18,center.y-hh*0.3); ctx.moveTo(center.x+ISO_TW*0.22,center.y-hh*0.7); ctx.lineTo(center.x+ISO_TW*0.3,center.y-hh*0.4); ctx.stroke();
      if((hv>>4)%4===0) drawIsoDiamond(ctx,center.x+3,center.y-hh-2,ISO_TW*0.35,ISO_TH*0.35,th.cap); }
    else if(type==='cave'){ drawIsoDiamond(ctx, center.x, center.y, ISO_TW+1, ISO_TH+1, top); const hv=hash2(tx,ty,13)%13;
      if(hv===0){ ctx.fillStyle='#3d342d'; ctx.beginPath(); ctx.ellipse(center.x-4,center.y+1,4,2,0,0,Math.PI*2); ctx.fill(); }
      else if(hv===1){ ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(center.x-8,center.y); ctx.lineTo(center.x-1,center.y+2); ctx.lineTo(center.x+6,center.y-1); ctx.stroke(); }
      else if(hv===2){ ctx.fillStyle='rgba(120,200,255,.22)'; ctx.beginPath(); ctx.ellipse(center.x+3,center.y,6,2.5,0,0,Math.PI*2); ctx.fill(); }
      if(caveRzAt(tx+0.5,ty+0.5)){ const pu=0.5+0.5*Math.sin(performance.now()/300+(tx+ty)*0.4); ctx.globalAlpha=0.16+0.1*pu; drawIsoDiamond(ctx,center.x,center.y,ISO_TW+1,ISO_TH+1,'#c01010'); ctx.globalAlpha=1;

      const npc=s.ref;

      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(26,18,8,0.7)';

      ctx.strokeStyle='#40485a'; ctx.lineWidth=1; ctx.stroke(); ctx.fillStyle='#303040'; ctx.beginPath(); ctx.arc(0,0,R*0.18,0,Math.PI*2); ctx.fill();
      if(sh==='bigshuriken'){ ctx.globalAlpha=0.35; ctx.strokeStyle='#b0ffff'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,R*1.3,0,Math.PI*1.2); ctx.stroke(); }
    } else if(sh==='dagger'){ const a=Math.atan2(worldToScreen(pr.x+pr.vx,pr.y+pr.vy).y-sc.y,worldToScreen(pr.x+pr.vx,pr.y+pr.vy).x-sc.x);
      ctx.translate(sc.x,sc.y-8); ctx.rotate(a); ctx.fillStyle=pr.color; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-4,-3); ctx.lineTo(-4,3); ctx.closePath(); ctx.fill(); ctx.fillStyle='#503060'; ctx.fillRect(-9,-1.5,5,3);
    } else if(sh==='wave'){ const a=Math.atan2(worldToScreen(pr.x+pr.vx,pr.y+pr.vy).y-sc.y,worldToScreen(pr.x+pr.vx,pr.y+pr.vy).x-sc.x);
      ctx.translate(sc.x,sc.y-10); ctx.rotate(a); ctx.shadowColor=pr.color; ctx.shadowBlur=16; ctx.fillStyle='rgba(140,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(0,0,pr.r*1.4,pr.r*2.4,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(3,0,pr.r*0.5,pr.r*1.2,0,0,Math.PI*2); ctx.fill();
    } else { // 法球：顏色依元素／職業，帶光暈與拖尾
      ctx.shadowColor=pr.color; ctx.shadowBlur=pr.o&&pr.o.spell?14:6;
      const tail=worldToScreen(pr.x-pr.vx*2,pr.y-pr.vy*2); ctx.globalAlpha=0.45; ctx.fillStyle=pr.color; ctx.beginPath(); ctx.arc(tail.x,tail.y-8,pr.r*0.7,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle=pr.color; ctx.beginPath();ctx.arc(sc.x, sc.y-8, pr.r, 0, Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath();ctx.arc(sc.x-2, sc.y-10, pr.r/2, 0, Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  }

  drawTopFx(performance.now()); // 光柱／斬擊弧／閃電／隕石

  drawCaveFx(vw,vh,performance.now());
  // Floating texts
  { const iz=1/Math.max(0.3,CAM_ZOOM||1), now=performance.now();
  for(const ft of floatingTexts){

  ctx.restore();
  // 能見度全開：不畫霧（大陸氛圍：紅岩暖光餘燼／冰封冰霧飄雪）
  drawContAtmos(vw,vh,performance.now());
  drawScreenFlash(vw,vh);
  if(QP) drawQuestPath();
  if(touchOrder) drawTouchMarker();
  drawMinimap(); // screen-space HUD minimap (after restore so zoom doesn't affect it)
}

/** 螢幕空間氛圍：紅岩暖光餘燼、冰封冰藍霧與飄雪 */
let atmos=[];
function drawContAtmos(vw,vh,now){
  ctx.save();
  const vg=ctx.createRadialGradient(vw/2,vh*0.42,Math.min(vw,vh)*0.22,vw/2,vh/2,Math.max(vw,vh)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.48)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,vw,vh);
  if(curCont==='scambray'){ ctx.restore(); return; }
  const g=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*0.25,vw/2,vh/2,Math.max(vw,vh)*0.75);
  if(curCont==='redrock'){ g.addColorStop(0,'rgba(255,80,30,0)'); g.addColorStop(1,'rgba(160,30,10,0.28)'); }
  else { g.addColorStop(0,'rgba(170,220,255,0)'); g.addColorStop(1,'rgba(150,200,240,0.38)'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,vw,vh);
  if(curCont==='frozen'){ // 冰藍霧帶
    for(let i=0;i<3;i++){ const y=vh*(0.25+i*0.28)+Math.sin(now/3000+i)*20, x=((now/40+i*400)%(vw+600))-300;
      const fg=ctx.createRadialGradient(x,y,10,x,y,260); fg.addColorStop(0,'rgba(200,235,255,0.16)'); fg.addColorStop(1,'rgba(200,235,255,0)'); ctx.fillStyle=fg; ctx.fillRect(x-260,y-260,520,520); }
  }
  const want=curCont==='frozen'?70:36;
  while(atmos.length<want) atmos.push({x:Math.random()*vw,y:Math.random()*vh,v:0.3+Math.random()*0.8,r:0.8+Math.random()*1.8,ph:Math.random()*6});
  if(atmos.length>want) atmos.length=want;
  for(const a of atmos){
    if(curCont==='frozen'){ a.y+=a.v; a.x+=Math.sin(now/900+a.ph)*0.4; ctx.fillStyle='rgba(255,255,255,0.85)'; }
    else { a.y-=a.v*0.7; a.x+=Math.sin(now/700+a.ph)*0.3; ctx.fillStyle=`rgba(255,${140+Math.round(60*Math.sin(now/300+a.ph))},40,0.75)`; }

    ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function playerSpriteOpt(p){
  const facing=p.facing||1;
  // 預設＝新手／職業外觀（無裝備時）：沿職業鏈繼承（新手→一轉→二轉→三轉）
  const base={facing,skin:'#f0c8a0',pants:'#3a3040',scale:1,armorStyle:null,shield:null};
  Object.assign(base,jobLook(jobOf(p)));
  // 裝備覆寫外表（卸下即回預設）
  if(p.equip){
    const eq=p.equip;
    if(eq.weapon && ITEMS[eq.weapon] && ITEMS[eq.weapon].weapon){
      const it=ITEMS[eq.weapon];
      base.weapon=it.weapon; base.weaponVariant=it.weaponVariant||null; base.weaponColor=it.weaponColor||null;
    } else if(eq.armor||eq.helmet||eq.offhand){
      base.weapon=null; base.weaponVariant=null; base.weaponColor=null;
    }
    if(eq.armor && ITEMS[eq.armor]){
      const it=ITEMS[eq.armor];
      const at=armorTypeOf(it);
      if(at) base.armorStyle=at; // drawHumanoid 讀 armorStyle
      if(at) base.armorType=at;
      if(it.body) base.body=it.body;
      if(it.pants) base.pants=it.pants;
      if(it.cape!==undefined) base.cape=it.cape||null;
      // 裝備防具時清掉職業 glow（避免布袍+金光混淆）
      if(at) base.glow=null;
    }
    if(eq.helmet && ITEMS[eq.helmet]){
      const it=ITEMS[eq.helmet];
      if(it.hat!==undefined) base.hat=it.hat;
    }
    if(eq.offhand && ITEMS[eq.offhand]){
      const it=ITEMS[eq.offhand];
      if(it.shield) base.shield=it.shield;
    }
  }
  return base;
}

function drawPlayer(p){
  const s=worldToScreen(p.x,p.y);
